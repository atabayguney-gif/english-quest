/* =========================================================================
   ENGLISH QUEST — white theme, playful mobile-game UI
   Scales from phones (360px) to interactive smart boards (1920px+)
   ========================================================================= */
:root {
  --bg: #F6F7FC;
  --surface: #FFFFFF;
  --ink: #1B1E3C;
  --ink-2: #464B6E;
  --muted: #8B90AD;
  --line: #E7E9F4;
  --line-2: #F1F2F8;
  --primary: #6D5DFC;
  --primary-d: #4F3FE0;
  --primary-l: #EFEDFF;
  --green: #22C55E; --green-d: #15A34A; --green-l: #E8FAEF;
  --red: #F04452;   --red-d: #D02A38;   --red-l: #FEEDEF;
  --orange: #F59E0B; --orange-d: #D97706; --orange-l: #FEF4E2;
  --gray-tile: #A1A6BD;
  --gold: #FACC15;
  --radius: 22px;
  --radius-sm: 14px;
  --shadow-sm: 0 2px 8px rgba(27, 30, 60, .06);
  --shadow: 0 10px 30px rgba(27, 30, 60, .08);
  --shadow-lg: 0 24px 60px rgba(27, 30, 60, .16);
  --font: 'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, Ubuntu, sans-serif;
  --display: 'Fredoka', 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --nav-h: 74px;
  --rail-w: 104px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --spring: cubic-bezier(.34, 1.56, .64, 1);
}
* { box-sizing: border-box; }
html { font-size: clamp(15px, 0.42vw + 12px, 27px); -webkit-text-size-adjust: 100%; }
body {
  margin: 0; font-family: var(--font); color: var(--ink); background: var(--bg);
  -webkit-tap-highlight-color: transparent; overflow-x: hidden; min-height: 100dvh;
  font-weight: 600; line-height: 1.4;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; touch-action: manipulation; }
input, select { font: inherit; color: inherit; }
h1, h2, h3, h4 { font-family: var(--display); margin: 0; font-weight: 700; letter-spacing: .01em; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.ic { width: 1.25em; height: 1.25em; flex: none; display: inline-block; vertical-align: middle; }
[hidden] { display: none !important; }
.row { display: flex; align-items: center; }
.gap { gap: .75rem; }
.grow { flex: 1; }
.center { text-align: center; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------------------------- animated background ---------------------------- */
#bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; background: linear-gradient(180deg, #FBFBFF 0%, #F4F5FC 100%); }
#bg span { position: absolute; border-radius: 50%; opacity: .55; animation: blob 26s ease-in-out infinite alternate; }
#bg span:nth-child(1) { width: 46vmax; height: 46vmax; left: -14vmax; top: -16vmax; background: radial-gradient(circle, rgba(109, 93, 252, .16), transparent 65%); }
#bg span:nth-child(2) { width: 40vmax; height: 40vmax; right: -14vmax; top: 18vh; background: radial-gradient(circle, rgba(236, 72, 153, .12), transparent 65%); animation-delay: -8s; }
#bg span:nth-child(3) { width: 44vmax; height: 44vmax; left: 20vw; bottom: -22vmax; background: radial-gradient(circle, rgba(6, 182, 212, .13), transparent 65%); animation-delay: -15s; }
#bg i { position: absolute; width: 10px; height: 10px; border-radius: 3px; opacity: .25; animation: drift 18s linear infinite; }
@keyframes blob { 0% { transform: translate(0, 0) scale(1); } 50% { transform: translate(6vw, 4vh) scale(1.08); } 100% { transform: translate(-4vw, 8vh) scale(.95); } }
@keyframes drift { from { transform: translateY(105vh) rotate(0); } to { transform: translateY(-10vh) rotate(360deg); } }

/* ---------------------------------- buttons ---------------------------------- */
.btn {
  --c: var(--primary); --cd: var(--primary-d);
  display: inline-flex; align-items: center; justify-content: center; gap: .5em;
  min-height: 3rem; padding: .7em 1.3em; border-radius: 16px;
  background: var(--c); color: #fff; font-family: var(--display); font-weight: 600; font-size: 1rem; letter-spacing: .02em;
  box-shadow: 0 5px 0 var(--cd), 0 10px 22px rgba(27, 30, 60, .14);
  transition: transform .12s var(--ease), box-shadow .12s var(--ease), filter .2s, opacity .2s;
  user-select: none; -webkit-user-select: none; white-space: nowrap;
}
.btn:hover { filter: brightness(1.06); }
.btn:active, .btn.pressed { transform: translateY(4px); box-shadow: 0 1px 0 var(--cd), 0 4px 10px rgba(27, 30, 60, .12); }
.btn:disabled { opacity: .45; pointer-events: none; filter: grayscale(.4); }
.btn.big { min-height: 3.6rem; font-size: 1.2rem; padding: .8em 1.8em; border-radius: 20px; }
.btn.sm { min-height: 2.4rem; font-size: .88rem; padding: .45em .9em; border-radius: 12px; box-shadow: 0 3px 0 var(--cd), 0 6px 14px rgba(27, 30, 60, .1); }
.btn.sm:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--cd); }
.btn.ghost { background: #fff; color: var(--ink); box-shadow: 0 4px 0 var(--line), 0 8px 18px rgba(27, 30, 60, .06); border: 2px solid var(--line); }
.btn.ghost:active { box-shadow: 0 0 0 var(--line); }
.btn.danger { --c: var(--red); --cd: var(--red-d); }
.btn.good { --c: var(--green); --cd: var(--green-d); }
.btn.gold { --c: #F59E0B; --cd: #C2710C; }
.btn.block { width: 100%; }
.icon-btn {
  width: 2.8rem; height: 2.8rem; border-radius: 14px; display: inline-grid; place-items: center;
  background: #fff; border: 2px solid var(--line); box-shadow: 0 3px 0 var(--line); color: var(--ink-2);
  transition: transform .12s, box-shadow .12s, background .2s;
}
.icon-btn:active { transform: translateY(3px); box-shadow: none; }
.icon-btn .ic { width: 1.35rem; height: 1.35rem; }
.tool-btn {
  display: inline-flex; flex-direction: column; align-items: center; gap: .2rem; padding: .5rem .7rem; min-width: 4.2rem;
  border-radius: 16px; background: #fff; border: 2px solid var(--line); box-shadow: 0 4px 0 var(--line); font-size: .78rem; font-weight: 800; color: var(--ink-2);
  transition: transform .12s, box-shadow .12s;
}
.tool-btn .ic { width: 1.4rem; height: 1.4rem; }
.tool-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.tool-btn:disabled { opacity: .45; pointer-events: none; }
.tool-btn small { font-size: .7rem; color: var(--muted); font-weight: 800; }
.tool-btn.hint { color: #B45309; }
.tool-btn.hint .ic { color: #F59E0B; }

/* speak button */
.speak {
  width: 2.3rem; height: 2.3rem; border-radius: 50%; display: inline-grid; place-items: center; flex: none;
  background: var(--primary-l); color: var(--primary); transition: transform .15s var(--spring), background .2s;
}
.speak:hover { background: #E2DEFF; }
.speak:active { transform: scale(.9); }
.speak .ic { width: 1.15rem; height: 1.15rem; }
.speak.lg { width: 2.9rem; height: 2.9rem; }
.speak.lg .ic { width: 1.45rem; height: 1.45rem; }
.speak.sm { width: 1.8rem; height: 1.8rem; }
.speak.sm .ic { width: .95rem; height: .95rem; }
.speak.speaking { background: var(--primary); color: #fff; animation: pulse 1s infinite; }
.speak.speaking .w1 { animation: wave 1s infinite; }
.speak.speaking .w2 { animation: wave 1s .2s infinite; }
@keyframes wave { 0%, 100% { opacity: 1; } 50% { opacity: .2; } }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(109, 93, 252, .5); } 100% { box-shadow: 0 0 0 14px rgba(109, 93, 252, 0); } }

/* chips */
.chip {
  display: inline-flex; align-items: center; gap: .35rem; padding: .32rem .75rem; border-radius: 999px;
  background: var(--line-2); color: var(--ink-2); font-size: .8rem; font-weight: 800; white-space: nowrap;
}
.chip .ic { width: 1rem; height: 1rem; }
.chip.c { background: color-mix(in srgb, var(--cc, var(--primary)) 13%, white); color: var(--cc, var(--primary)); }
.chips { display: flex; gap: .5rem; overflow-x: auto; padding: .2rem .1rem .6rem; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip-btn {
  display: inline-flex; align-items: center; gap: .4rem; padding: .55rem 1rem; border-radius: 999px; white-space: nowrap;
  background: #fff; border: 2px solid var(--line); font-weight: 800; font-size: .88rem; color: var(--ink-2); transition: all .2s var(--ease);
}
.chip-btn .ic { width: 1.05rem; height: 1.05rem; }
.chip-btn.active { background: var(--cc, var(--primary)); border-color: var(--cc, var(--primary)); color: #fff; box-shadow: 0 6px 16px rgba(27, 30, 60, .15); transform: translateY(-1px); }

/* cards */
.card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid rgba(231, 233, 244, .7); }
.pad { padding: 1.1rem; }
.section-title { display: flex; align-items: center; justify-content: space-between; margin: 1.6rem 0 .8rem; }
.section-title h2 { font-size: 1.3rem; }
.section-title .link { color: var(--primary); font-weight: 800; font-size: .9rem; display: inline-flex; align-items: center; gap: .3rem; }

/* ----------------------------------- navigation ----------------------------------- */
#app { min-height: 100dvh; }
#nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; height: calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding: 0 .6rem env(safe-area-inset-bottom); display: flex; align-items: center; justify-content: space-around;
  background: rgba(255, 255, 255, .9); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid var(--line); box-shadow: 0 -8px 30px rgba(27, 30, 60, .06);
  transition: transform .4s var(--ease);
}
body.in-game #nav, body.in-welcome #nav { transform: translateY(115%); }
.nav-item {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: .15rem; padding: .45rem .8rem; border-radius: 16px;
  color: var(--muted); font-size: .72rem; font-weight: 800; transition: color .2s, background .3s var(--ease); min-width: 3.2rem;
}
@media (max-width: 420px) { .nav-item { padding: .45rem .35rem; font-size: .66rem; } .nav-item .ic { width: 1.4rem; height: 1.4rem; } }
.nav-item .ic { width: 1.55rem; height: 1.55rem; transition: transform .35s var(--spring); }
.nav-item.active { color: var(--primary); background: var(--primary-l); }
.nav-item.active .ic { transform: translateY(-2px) scale(1.12); }
.nav-dot { position: absolute; top: .3rem; right: .9rem; width: .6rem; height: .6rem; border-radius: 50%; background: var(--red); border: 2px solid #fff; }
.nav-brand { display: none; }
#view { position: relative; min-height: 100dvh; transition: margin .4s var(--ease); }
@media (min-width: 1000px) {
  #nav { top: 0; right: auto; width: var(--rail-w); height: auto; flex-direction: column; justify-content: flex-start; gap: .55rem; padding: 1.2rem .5rem; border-top: 0; border-right: 1px solid var(--line); box-shadow: 8px 0 30px rgba(27, 30, 60, .04); }
  body.in-game #nav, body.in-welcome #nav { transform: translateX(-110%); }
  .nav-brand { display: grid; place-items: center; width: 3.4rem; height: 3.4rem; border-radius: 18px; margin-bottom: 1.2rem; background: linear-gradient(135deg, #8B7BFF, #5243E0); color: #fff; box-shadow: 0 8px 20px rgba(109, 93, 252, .35); font-family: var(--display); font-size: 1.15rem; }
  .nav-item { width: 100%; padding: .7rem .3rem; }
  #view { margin-left: var(--rail-w); }
  body.in-game #view, body.in-welcome #view { margin-left: 0; }
}

/* ------------------------------------ screens ------------------------------------ */
.screen { animation: scrIn .45s var(--ease) both; }
.screen.leaving { position: absolute; inset: 0 0 auto 0; animation: scrOut .25s var(--ease) forwards; pointer-events: none; }
@keyframes scrIn { from { opacity: 0; transform: translateY(14px) scale(.99); } to { opacity: 1; transform: none; } }
@keyframes scrOut { to { opacity: 0; transform: translateY(-8px) scale(.99); } }
.screen.is-page { max-width: 1240px; margin: 0 auto; padding: 1.1rem 1rem calc(var(--nav-h) + 2rem + env(safe-area-inset-bottom)); }
@media (min-width: 1000px) { .screen.is-page { padding: 1.6rem 2rem 2.5rem; } }
.screen.is-game { min-height: 100dvh; height: 100dvh; display: flex; flex-direction: column; max-width: 1180px; margin: 0 auto; padding: .7rem 1rem calc(.7rem + env(safe-area-inset-bottom)); overflow: hidden; }
.page-head { display: flex; align-items: center; gap: .8rem; margin-bottom: 1.1rem; }
.page-head h1 { font-size: 1.7rem; }
.page-head p { color: var(--muted); font-size: .9rem; }
.page-head .icon-btn { flex: none; }

/* ----------------------------------- welcome ----------------------------------- */
.welcome { min-height: 100dvh; display: grid; place-items: center; padding: 1.5rem 1rem; }
.welcome-card { width: min(560px, 100%); text-align: center; }
.logo { display: inline-flex; flex-direction: column; align-items: center; gap: .3rem; }
.logo-mark { width: 5.2rem; height: 5.2rem; border-radius: 26px; display: grid; place-items: center; background: linear-gradient(135deg, #9B8CFF, #5243E0); color: #fff; box-shadow: 0 16px 40px rgba(109, 93, 252, .4); animation: floaty 3.5s ease-in-out infinite; }
.logo-mark .ic { width: 2.8rem; height: 2.8rem; }
.logo-word { font-family: var(--display); font-weight: 700; font-size: 2.6rem; line-height: 1; letter-spacing: .02em; background: linear-gradient(90deg, #6D5DFC, #EC4899 60%, #F59E0B); -webkit-background-clip: text; background-clip: text; color: transparent; margin-top: .8rem; }
.logo-sub { color: var(--muted); font-weight: 800; font-size: .95rem; }
.wel-mascots { display: flex; justify-content: center; margin: 1.6rem 0 1.2rem; height: 6.5rem; }
.wel-mascots .avatar { margin: 0 -.5rem; animation: hop 2.6s var(--ease) infinite; box-shadow: 0 10px 25px rgba(27, 30, 60, .12); border: 4px solid #fff; }
.wel-mascots .avatar:nth-child(2) { animation-delay: .2s; transform: translateY(-12px); z-index: 2; }
.wel-mascots .avatar:nth-child(3) { animation-delay: .4s; }
@keyframes hop { 0%, 60%, 100% { translate: 0 0; } 30% { translate: 0 -12px; } }
@keyframes floaty { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-8px) rotate(3deg); } }
.wel-feats { display: grid; grid-template-columns: repeat(3, 1fr); gap: .6rem; margin: 1.2rem 0 1.6rem; }
.wel-feats div { background: #fff; border-radius: 16px; padding: .8rem .4rem; box-shadow: var(--shadow-sm); font-size: .8rem; font-weight: 800; color: var(--ink-2); }
.wel-feats .ic { width: 1.6rem; height: 1.6rem; display: block; margin: 0 auto .35rem; }
.name-input {
  width: 100%; font-size: 1.35rem; font-weight: 800; text-align: center; padding: .9rem 1rem; border-radius: 18px;
  border: 3px solid var(--line); background: #fff; outline: none; transition: border .2s, box-shadow .2s; font-family: var(--display);
}
.name-input:focus { border-color: var(--primary); box-shadow: 0 0 0 6px var(--primary-l); }
.avatar-pick { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: .55rem; margin: 1.2rem 0 1.4rem; padding: 0 .3rem; }
.avatar-pick button { border-radius: 50%; padding: 0; aspect-ratio: 1; min-width: 0; border: 4px solid transparent; transition: transform .25s var(--spring), border .2s; }
.avatar-pick button .avatar { width: 100% !important; height: 100% !important; }
.avatar-pick button.sel { border-color: var(--primary); transform: scale(1.12); box-shadow: 0 8px 18px rgba(109, 93, 252, .3); }
.step-dots { display: flex; justify-content: center; gap: .4rem; margin-bottom: 1.2rem; }
.step-dots i { width: .55rem; height: .55rem; border-radius: 99px; background: var(--line); transition: all .3s; }
.step-dots i.on { width: 1.6rem; background: var(--primary); }
.join-anim { padding: 1rem 0; }
.join-anim .avatar { animation: popIn .6s var(--spring) both; border: 5px solid #fff; box-shadow: 0 14px 30px rgba(27, 30, 60, .15); }
.join-rank { font-family: var(--display); font-size: 3.4rem; color: var(--primary); animation: popIn .6s .3s var(--spring) both; line-height: 1.1; margin-top: .5rem; }
.player-list { display: grid; gap: .6rem; margin: 1rem 0; text-align: left; }
.player-row { display: flex; align-items: center; gap: .8rem; padding: .6rem .8rem; border-radius: 18px; background: #fff; border: 2px solid var(--line); transition: transform .2s, border .2s; width: 100%; }
.player-row:hover { border-color: var(--primary); transform: translateY(-2px); }
.player-row b { font-size: 1.05rem; }
.player-row small { color: var(--muted); display: block; font-weight: 700; }

/* avatars */
.avatar { --s: 44px; width: var(--s); height: var(--s); border-radius: 50%; overflow: hidden; display: inline-block; flex: none; background: #fff; }
.avatar-svg { width: 100%; height: 100%; display: block; }
.av-eyes { transform-origin: 50px 57px; animation: blink 4.5s infinite; }
@keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }

/* ------------------------------------- home ------------------------------------- */
.home-top { display: flex; align-items: center; gap: .8rem; margin-bottom: 1rem; }
.home-top .who { flex: 1; min-width: 0; }
.home-top .who small { color: var(--muted); font-weight: 800; display: block; font-size: .82rem; }
.home-top .who b { font-family: var(--display); font-size: 1.35rem; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.home-top .avatar { border: 3px solid #fff; box-shadow: var(--shadow); cursor: pointer; }
.pill { display: inline-flex; align-items: center; gap: .35rem; padding: .45rem .8rem; border-radius: 999px; background: #fff; box-shadow: var(--shadow-sm); border: 1px solid var(--line); font-weight: 900; font-size: .95rem; }
.pill .ic { width: 1.2rem; height: 1.2rem; }
.pill.fire .ic { color: #F97316; }
.pill.xp .ic { color: #EAB308; }
.stats-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: .7rem; }
.stat {
  position: relative; overflow: hidden; background: #fff; border-radius: 20px; padding: .9rem .8rem; box-shadow: var(--shadow-sm); border: 1px solid var(--line);
  display: flex; flex-direction: column; gap: .1rem; animation: rise .6s var(--ease) both;
}
.stat:nth-child(2) { animation-delay: .06s; } .stat:nth-child(3) { animation-delay: .12s; } .stat:nth-child(4) { animation-delay: .18s; }
.stat .s-ic { width: 2.3rem; height: 2.3rem; border-radius: 12px; display: grid; place-items: center; color: #fff; background: var(--sc); margin-bottom: .35rem; box-shadow: 0 6px 14px rgba(27, 30, 60, .12); }
.stat .s-ic .ic { width: 1.25rem; height: 1.25rem; }
.stat b { font-family: var(--display); font-size: 1.45rem; line-height: 1.1; }
.stat small { color: var(--muted); font-weight: 800; font-size: .76rem; }
.stat .s-bar { height: 6px; background: var(--line-2); border-radius: 99px; margin-top: .4rem; overflow: hidden; }
.stat .s-bar i { display: block; height: 100%; border-radius: inherit; background: var(--sc); width: 0; transition: width 1.2s var(--ease); }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
@media (max-width: 560px) {
  .stats-strip { grid-template-columns: repeat(2, 1fr); }
}

.hero {
  position: relative; overflow: hidden; margin-top: 1rem; border-radius: 28px; padding: 1.4rem 1.4rem 1.5rem;
  background: linear-gradient(130deg, #7B6BFF 0%, #5B4BF0 45%, #3B82F6 100%); color: #fff; box-shadow: 0 20px 45px rgba(91, 75, 240, .32);
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 1rem; animation: rise .6s .1s var(--ease) both;
}
.hero::before, .hero::after { content: ''; position: absolute; border-radius: 50%; background: rgba(255, 255, 255, .1); }
.hero::before { width: 18rem; height: 18rem; right: -6rem; top: -8rem; }
.hero::after { width: 10rem; height: 10rem; left: -3rem; bottom: -5rem; }
.hero h2 { font-size: 1.7rem; line-height: 1.15; position: relative; }
.hero p { opacity: .9; margin: .35rem 0 1.1rem; font-weight: 700; position: relative; }
.hero .btn { --c: #fff; --cd: #D9D4FF; color: var(--primary-d); position: relative; animation: glow 2.4s ease-in-out infinite; }
.hero .btn .ic { color: var(--primary); }
@keyframes glow { 0%, 100% { box-shadow: 0 5px 0 #D9D4FF, 0 0 0 0 rgba(255, 255, 255, .6); } 50% { box-shadow: 0 5px 0 #D9D4FF, 0 0 0 12px rgba(255, 255, 255, 0); } }
.hero-mascot { position: relative; width: 8rem; height: 8rem; }
.hero-mascot .avatar { --s: 8rem !important; border: 5px solid rgba(255, 255, 255, .5); animation: floaty 3.4s ease-in-out infinite; }
.hero-mascot .bubble { position: absolute; top: -.4rem; left: -3.6rem; background: #fff; color: var(--ink); font-weight: 900; font-size: .8rem; padding: .35rem .7rem; border-radius: 14px 14px 4px 14px; box-shadow: var(--shadow); animation: popIn .5s 1s var(--spring) both; white-space: nowrap; }
.hero .next-up { display: inline-flex; align-items: center; gap: .4rem; font-size: .8rem; font-weight: 800; background: rgba(255, 255, 255, .18); padding: .3rem .7rem; border-radius: 99px; margin-bottom: .6rem; position: relative; }
@media (max-width: 520px) { .hero { grid-template-columns: 1fr; } .hero-mascot { position: absolute; right: .8rem; top: .8rem; width: 4.6rem; height: 4.6rem; } .hero-mascot .avatar { --s: 4.6rem !important; } .hero-mascot .bubble { display: none; } .hero h2 { padding-right: 5rem; font-size: 1.45rem; } }

.menu-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: .7rem; }
.menu-tile {
  position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: .55rem; padding: .95rem; border-radius: 20px; background: #fff;
  border: 1px solid var(--line); box-shadow: var(--shadow-sm); text-align: left; transition: transform .25s var(--spring), box-shadow .25s; animation: rise .5s var(--ease) both;
}
.menu-tile:hover { transform: translateY(-4px); box-shadow: var(--shadow); }
.menu-tile:active { transform: scale(.97); }
.menu-tile .mt-ic { width: 2.6rem; height: 2.6rem; border-radius: 14px; display: grid; place-items: center; background: color-mix(in srgb, var(--mc) 14%, white); color: var(--mc); }
.menu-tile .mt-ic .ic { width: 1.4rem; height: 1.4rem; }
.menu-tile b { font-size: .95rem; font-weight: 900; line-height: 1.15; }
.menu-tile small { color: var(--muted); font-weight: 700; font-size: .75rem; margin-top: -.35rem; }
.menu-tile .badge { position: absolute; top: .6rem; right: .6rem; min-width: 1.4rem; height: 1.4rem; padding: 0 .4rem; border-radius: 99px; background: var(--red); color: #fff; font-size: .75rem; font-weight: 900; display: grid; place-items: center; animation: pop 1.6s infinite; }
@keyframes pop { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }
@media (max-width: 700px) { .menu-grid { grid-template-columns: repeat(2, 1fr); } }

.games-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
@media (max-width: 900px) { .games-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 520px) { .games-grid { grid-template-columns: 1fr 1fr; gap: .7rem; } }
.game-card {
  position: relative; overflow: hidden; border-radius: 24px; background: var(--gg); color: #fff; padding: 1rem; min-height: 11.5rem;
  display: flex; flex-direction: column; justify-content: flex-end; text-align: left; box-shadow: 0 14px 30px rgba(27, 30, 60, .15);
  transition: transform .3s var(--spring), box-shadow .3s; animation: rise .55s var(--ease) both;
}
.game-card:hover { transform: translateY(-6px) rotate(-.6deg); box-shadow: 0 22px 40px rgba(27, 30, 60, .2); }
.game-card:active { transform: scale(.97); }
.game-card .gc-art { position: absolute; top: .45rem; right: .35rem; width: 60%; height: 46%; max-width: 9.5rem; opacity: .97; transition: transform .5s var(--spring); }
.game-card .gc-art svg { width: 100%; height: 100%; display: block; }
.game-card:hover .gc-art { transform: scale(1.08) rotate(3deg); }
.game-card .gc-num { position: absolute; top: .8rem; left: .9rem; font-family: var(--display); font-size: .78rem; background: rgba(255, 255, 255, .22); padding: .15rem .55rem; border-radius: 99px; }
.game-card b { font-family: var(--display); font-size: 1.2rem; line-height: 1.1; position: relative; }
.game-card small { opacity: .9; font-weight: 700; font-size: .78rem; position: relative; }
.game-card .gc-foot { display: flex; align-items: center; justify-content: space-between; margin-top: .6rem; position: relative; }
.game-card .gc-best { font-size: .75rem; font-weight: 800; background: rgba(0, 0, 0, .14); padding: .2rem .55rem; border-radius: 99px; display: inline-flex; gap: .25rem; align-items: center; }
.game-card .gc-best .ic { width: .9rem; height: .9rem; }
.game-card .gc-play { width: 2.4rem; height: 2.4rem; border-radius: 50%; background: #fff; color: var(--gcc); display: grid; place-items: center; box-shadow: 0 6px 14px rgba(0, 0, 0, .15); }
.game-card .gc-play .ic { width: 1rem; height: 1rem; margin-left: 2px; }
.special-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1rem; }
@media (max-width: 640px) { .special-row { grid-template-columns: 1fr; } }
.special-card { display: flex; align-items: center; gap: 1rem; padding: 1rem 1.1rem; border-radius: 24px; background: var(--gg); color: #fff; text-align: left; box-shadow: 0 14px 30px rgba(27, 30, 60, .15); transition: transform .3s var(--spring); position: relative; overflow: hidden; }
.special-card:hover { transform: translateY(-4px); }
.special-card .sc-ic { width: 3.4rem; height: 3.4rem; border-radius: 18px; background: rgba(255, 255, 255, .22); display: grid; place-items: center; flex: none; }
.special-card .sc-ic .ic { width: 1.9rem; height: 1.9rem; }
.special-card b { font-family: var(--display); font-size: 1.2rem; display: block; }
.special-card small { opacity: .92; font-weight: 700; font-size: .8rem; }
.special-card .lock-tag { position: absolute; top: .7rem; right: .8rem; font-size: .72rem; font-weight: 900; background: rgba(0, 0, 0, .18); padding: .2rem .6rem; border-radius: 99px; display: inline-flex; align-items: center; gap: .3rem; }
.special-card .lock-tag .ic { width: .85rem; height: .85rem; }

.wotd { display: grid; grid-template-columns: auto 1fr auto; gap: 1rem; align-items: center; padding: 1.1rem; }
.wotd .w-badge { width: 3.4rem; height: 3.4rem; border-radius: 18px; display: grid; place-items: center; background: linear-gradient(135deg, #FDE68A, #F59E0B); color: #fff; box-shadow: 0 8px 18px rgba(245, 158, 11, .35); }
.wotd .w-badge .ic { width: 1.7rem; height: 1.7rem; }
.wotd small { color: var(--muted); font-weight: 800; text-transform: uppercase; font-size: .7rem; letter-spacing: .08em; }
.wotd b { font-family: var(--display); font-size: 1.4rem; display: block; line-height: 1.15; }
.wotd .tr { color: var(--ink-2); font-weight: 700; font-size: .9rem; }
.wotd .ex { color: var(--muted); font-size: .85rem; font-style: italic; margin-top: .2rem; }

/* ------------------------------------ learn ------------------------------------ */
.search { position: relative; margin-bottom: .8rem; }
.search input { width: 100%; padding: .85rem 1rem .85rem 2.9rem; border-radius: 18px; border: 2px solid var(--line); background: #fff; font-weight: 700; outline: none; transition: border .2s, box-shadow .2s; }
.search input:focus { border-color: var(--primary); box-shadow: 0 0 0 5px var(--primary-l); }
.search .ic { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--muted); }
.learn-bar { display: flex; gap: .6rem; align-items: center; justify-content: space-between; flex-wrap: wrap; margin: .2rem 0 1rem; }
.seg { display: inline-flex; background: var(--line-2); border-radius: 14px; padding: .25rem; gap: .2rem; }
.seg button { padding: .45rem .8rem; border-radius: 11px; font-weight: 800; font-size: .82rem; color: var(--muted); transition: all .2s; display: inline-flex; gap: .3rem; align-items: center; }
.seg button .ic { width: .95rem; height: .95rem; }
.seg button.active { background: #fff; color: var(--ink); box-shadow: var(--shadow-sm); }
.word-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: .9rem; }
.flip { perspective: 1200px; min-height: 13.5rem; animation: rise .45s var(--ease) both; }
.flip-in { position: relative; width: 100%; height: 100%; min-height: 13.5rem; transition: transform .6s var(--spring); transform-style: preserve-3d; }
.flip.flipped .flip-in { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 22px; background: #fff; border: 1px solid var(--line); box-shadow: var(--shadow-sm); padding: 1rem; display: flex; flex-direction: column; overflow: hidden; }
.face::before { content: ''; position: absolute; left: 0; top: 0; right: 0; height: 5px; background: var(--cc); }
.face.back { overflow-y: auto; transform: rotateY(180deg); background: linear-gradient(160deg, #fff 0%, color-mix(in srgb, var(--cc) 8%, white) 100%); }
.face .f-cat { font-size: .7rem; font-weight: 900; color: var(--cc); text-transform: uppercase; letter-spacing: .07em; }
.face .f-en { font-family: var(--display); font-size: 1.45rem; line-height: 1.15; margin: .5rem 0 .2rem; word-break: break-word; }
.face .f-ipa { color: var(--muted); font-size: .9rem; font-weight: 700; }
.face .f-hint { color: var(--muted); font-weight: 800; font-size: .85rem; margin-top: .2rem; }
.face .f-word { font-family: var(--display); font-size: .95rem; color: var(--muted); margin-top: .1rem; }
.face .f-pair { font-weight: 800; color: var(--cc); font-size: .95rem; }
.face .f-pair b { font-family: var(--display); font-weight: 600; }
.face .f-tr-front { font-weight: 800; font-size: 1.05rem; color: var(--cc); line-height: 1.25; }
.face .f-tr-front span { display: block; font-size: .65rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 900; }
.wc-head .lbl { display: block; font-size: .66rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 900; }
.face .f-actions { margin-top: auto; display: flex; align-items: center; gap: .5rem; }
.face .f-tap { margin-left: auto; color: var(--muted); font-size: .72rem; font-weight: 800; display: inline-flex; align-items: center; gap: .25rem; }
.face .f-tap .ic { width: .9rem; height: .9rem; }
.face .f-tr { font-family: var(--display); font-size: 1.3rem; color: var(--cc); line-height: 1.2; margin: .3rem 0 .6rem; }
.face .f-ex { font-size: .88rem; color: var(--ink); font-weight: 700; }
.face .f-ex-tr { font-size: .82rem; color: var(--muted); margin-top: .25rem; font-weight: 700; }
.mini-toggle { width: 2.3rem; height: 2.3rem; border-radius: 50%; display: grid; place-items: center; background: var(--line-2); color: var(--muted); transition: all .25s var(--spring); }
.mini-toggle .ic { width: 1.1rem; height: 1.1rem; }
.mini-toggle.on.fav { background: #FFE4EC; color: #F43F5E; }
.mini-toggle.on.fav .ic { fill: #F43F5E; }
.mini-toggle.on.known { background: var(--green-l); color: var(--green); }
.mini-toggle:active { transform: scale(.85); }
.known-tag { position: absolute; top: .9rem; right: .9rem; color: var(--green); background: var(--green-l); border-radius: 99px; padding: .15rem .5rem; font-size: .7rem; font-weight: 900; display: inline-flex; align-items: center; gap: .2rem; }
.known-tag .ic { width: .8rem; height: .8rem; }
.empty { text-align: center; padding: 2.5rem 1rem; color: var(--muted); font-weight: 800; }
.empty .ic { width: 3rem; height: 3rem; display: block; margin: 0 auto .7rem; color: #C9CCE0; }

/* flashcard review */
.fc-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.2rem; }
.fc { width: min(30rem, 100%); }
.fc .flip, .fc .flip-in { min-height: 19rem; }
.fc .face { padding: 1.6rem; align-items: center; text-align: center; justify-content: center; }
.fc .f-en { font-size: 2.2rem; }
.fc .f-tr { font-size: 1.8rem; }
.fc-btns { display: flex; gap: .8rem; width: min(30rem, 100%); }
.fc-btns .btn { flex: 1; }

/* ---------------------------------- game shell ---------------------------------- */
.g-top { display: flex; align-items: center; gap: .7rem; padding: .2rem 0 .6rem; flex: none; }
.g-top .g-title { flex: 1; min-width: 0; }
.g-top .g-title b { font-family: var(--display); font-size: 1.2rem; display: block; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g-top .g-title small { color: var(--muted); font-weight: 800; font-size: .78rem; }
.score-pill { display: inline-flex; align-items: center; gap: .4rem; padding: .45rem .9rem; border-radius: 999px; background: #fff; border: 2px solid var(--line); font-family: var(--display); font-size: 1.05rem; box-shadow: 0 3px 0 var(--line); }
.score-pill .ic { width: 1.1rem; height: 1.1rem; color: var(--gc, var(--primary)); }
.score-pill.bump { animation: bump .4s var(--spring); }
@keyframes bump { 50% { transform: scale(1.18); } }
.g-progress { height: .8rem; border-radius: 99px; background: var(--line-2); overflow: hidden; flex: none; position: relative; }
.g-progress i { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--gc, var(--primary)), color-mix(in srgb, var(--gc, var(--primary)) 70%, white)); transition: width .6s var(--ease); position: relative; }
.g-progress i::after { content: ''; position: absolute; left: .5rem; right: .5rem; top: 2px; height: 3px; border-radius: 99px; background: rgba(255, 255, 255, .45); }
.g-body { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
.g-steps { display: flex; gap: .35rem; justify-content: center; margin: .3rem 0 .2rem; flex: none; }
.g-steps i { width: .7rem; height: .7rem; border-radius: 99px; background: var(--line); transition: all .35s var(--spring); }
.g-steps i.done { background: var(--gc); }
.g-steps i.cur { width: 1.8rem; background: color-mix(in srgb, var(--gc) 45%, white); }
.clue {
  position: relative; background: #fff; border-radius: 22px; padding: .9rem 1.1rem; box-shadow: var(--shadow); border: 1px solid var(--line);
  text-align: center; animation: popIn .45s var(--spring) both; flex: none;
}
.clue .c-lbl { font-size: .72rem; font-weight: 900; text-transform: uppercase; letter-spacing: .1em; color: var(--gc); }
.clue .c-main { font-family: var(--display); font-size: 1.6rem; line-height: 1.2; margin: .15rem 0; }
.clue .c-sub { color: var(--muted); font-weight: 700; font-size: .85rem; }
.clue .c-hint { margin-top: .45rem; padding: .45rem .7rem; border-radius: 12px; background: #FFF8E6; color: #92400E; font-size: .85rem; font-weight: 700; animation: popIn .35s var(--spring) both; }
@keyframes popIn { from { opacity: 0; transform: scale(.7); } to { opacity: 1; transform: none; } }
.g-tools { display: flex; justify-content: center; gap: .6rem; flex: none; padding: .5rem 0 .2rem; flex-wrap: wrap; }

/* start screen of a game (level/mode select) */
.g-start { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 1.1rem; text-align: center; padding: 1rem 0 2rem; overflow-y: auto; }
.g-start > :first-child { margin-top: auto; }
.g-start > :last-child { margin-bottom: auto; }
.g-start .gs-art { width: 9rem; height: 9rem; border-radius: 34px; background: var(--gg); display: grid; place-items: center; box-shadow: 0 20px 40px rgba(27, 30, 60, .18); animation: floaty 3.5s ease-in-out infinite; }
.g-start .gs-art svg { width: 78%; }
.g-start h1 { font-size: 2.1rem; }
.g-start p { color: var(--ink-2); font-weight: 700; max-width: 34rem; }
.g-start .how { display: grid; gap: .5rem; text-align: left; max-width: 30rem; width: 100%; }
.g-start .how div { display: flex; gap: .6rem; align-items: flex-start; background: #fff; padding: .6rem .8rem; border-radius: 14px; border: 1px solid var(--line); font-weight: 700; font-size: .9rem; color: var(--ink-2); }
.g-start .how .n { width: 1.6rem; height: 1.6rem; border-radius: 50%; flex: none; display: grid; place-items: center; background: var(--gl); color: var(--gc); font-weight: 900; font-size: .8rem; }
.mode-row { display: flex; flex-wrap: wrap; justify-content: center; gap: .7rem; }
.mode-card { min-width: 9rem; padding: .9rem 1rem; border-radius: 20px; background: #fff; border: 3px solid var(--line); text-align: center; transition: all .25s var(--spring); box-shadow: 0 4px 0 var(--line); }
.mode-card b { display: block; font-family: var(--display); font-size: 1.1rem; }
.mode-card small { color: var(--muted); font-weight: 700; font-size: .78rem; }
.mode-card .ic { width: 1.8rem; height: 1.8rem; color: var(--gc); display: block; margin: 0 auto .3rem; }
.mode-card.sel { border-color: var(--gc); background: var(--gl); transform: translateY(-3px); box-shadow: 0 7px 0 color-mix(in srgb, var(--gc) 40%, white); }
.level-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: .6rem; width: min(26rem, 100%); }
.lvl {
  aspect-ratio: 1; border-radius: 18px; background: #fff; border: 3px solid var(--line); font-family: var(--display); font-size: 1.3rem; position: relative;
  display: grid; place-items: center; box-shadow: 0 4px 0 var(--line); transition: transform .2s var(--spring);
}
.lvl:active { transform: translateY(3px); box-shadow: none; }
.lvl.done { background: var(--gl); border-color: var(--gc); color: var(--gd); box-shadow: 0 4px 0 color-mix(in srgb, var(--gc) 45%, white); }
.lvl.cur { background: var(--gc); color: #fff; border-color: var(--gd); box-shadow: 0 4px 0 var(--gd); animation: pop 1.8s infinite; }
.lvl.locked { color: #C3C6D8; background: var(--line-2); pointer-events: none; }
.lvl.locked .ic { width: 1.2rem; height: 1.2rem; }
.lvl .lstars { position: absolute; bottom: -.45rem; left: 50%; transform: translateX(-50%); display: flex; gap: 1px; }
.lvl .lstars .ic { width: .75rem; height: .75rem; fill: #FACC15; color: #EAB308; }

/* feedback bottom sheet */
.sheet {
  position: fixed; left: 50%; bottom: 0; transform: translate(-50%, 110%); width: min(46rem, 100%); z-index: 70;
  background: #fff; border-radius: 28px 28px 0 0; padding: 1.2rem 1.2rem calc(1.2rem + env(safe-area-inset-bottom)); box-shadow: 0 -20px 50px rgba(27, 30, 60, .2);
  transition: transform .45s var(--spring); max-height: 78dvh; overflow-y: auto;
}
.sheet.show { transform: translate(-50%, 0); }
.sheet.good { border-top: 6px solid var(--green); }
.sheet.bad { border-top: 6px solid var(--red); }
.sheet .sh-head { display: flex; align-items: center; gap: .7rem; margin-bottom: .7rem; }
.sheet .sh-ic { width: 2.8rem; height: 2.8rem; border-radius: 50%; display: grid; place-items: center; color: #fff; flex: none; animation: popIn .45s var(--spring) both; }
.sheet.good .sh-ic { background: var(--green); }
.sheet.bad .sh-ic { background: var(--red); }
.sheet .sh-ic .ic { width: 1.6rem; height: 1.6rem; stroke-width: 3; }
.sheet h3 { font-size: 1.4rem; }
.sheet.good h3 { color: var(--green-d); }
.sheet.bad h3 { color: var(--red-d); }
.sheet .sh-body { display: grid; gap: .6rem; margin-bottom: 1rem; }
.sheet .btn { width: 100%; }
.sheet.good .btn.next { --c: var(--green); --cd: var(--green-d); }
.sheet.bad .btn.next { --c: var(--red); --cd: var(--red-d); }
.exp { background: var(--line-2); border-radius: 14px; padding: .7rem .9rem; font-size: .92rem; font-weight: 700; color: var(--ink-2); }
.exp b { color: var(--ink); }
.ans-row { display: flex; gap: .5rem; flex-wrap: wrap; font-size: .9rem; font-weight: 800; }
.ans-row span { padding: .3rem .7rem; border-radius: 10px; }
.ans-row .mine { background: var(--red-l); color: var(--red-d); text-decoration: line-through; }
.ans-row .right { background: var(--green-l); color: var(--green-d); }

/* word card (in sheets/results) */
.wcard { background: linear-gradient(160deg, #fff, color-mix(in srgb, var(--cc) 7%, white)); border: 2px solid color-mix(in srgb, var(--cc) 20%, white); border-radius: 20px; padding: .9rem 1rem; display: grid; gap: .5rem; }
.wc-head { display: flex; align-items: center; justify-content: space-between; gap: .6rem; }
.wc-en { font-family: var(--display); font-size: 1.5rem; line-height: 1.1; }
.wc-ipa { color: var(--muted); font-weight: 700; font-size: .85rem; }
.wc-tr { font-weight: 800; color: var(--cc); font-size: 1.1rem; }
.wc-tr .lbl, .wc-ex .lbl { display: block; font-size: .66rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 900; }
.wc-ex .en { display: flex; gap: .5rem; align-items: flex-start; font-weight: 700; font-size: .92rem; }
.wc-ex .tr { color: var(--muted); font-size: .85rem; margin-top: .2rem; padding-left: 2.3rem; font-weight: 700; }

/* ------------------------------- WORD CONNECT ------------------------------- */
.wc-area { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: clamp(1rem, 3.5vh, 2.4rem); min-height: 0; }
.slots { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--gap); --gap: clamp(4px, 1vw, 10px); }
.slot {
  width: var(--ts); height: calc(var(--ts) * 1.12); border-radius: 14px; background: #fff; border: 3px dashed #D5D8E8;
  display: grid; place-items: center; font-family: var(--display); font-size: calc(var(--ts) * .5); color: var(--ink); transition: all .25s var(--spring);
}
.slot.filled { border-style: solid; border-color: var(--gc); background: var(--gl); box-shadow: 0 4px 0 color-mix(in srgb, var(--gc) 45%, white); animation: slotIn .3s var(--spring); cursor: pointer; }
.slot.locked { border-color: #F59E0B; background: #FFF6DE; color: #B45309; box-shadow: 0 4px 0 #FCD48A; cursor: default; }
.slot.hover { border-color: var(--gc); transform: scale(1.08); }
.slot.ok { background: var(--green); border-color: var(--green-d); color: #fff; box-shadow: 0 4px 0 var(--green-d); animation: wavey .55s var(--spring) both; animation-delay: calc(var(--i) * 60ms); }
.slot.no { background: var(--red-l); border-color: var(--red); color: var(--red-d); }
@keyframes slotIn { from { transform: scale(.5); } }
@keyframes wavey { 40% { transform: translateY(-14px) scale(1.1); } }
.tiles { display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(6px, 1.4vw, 14px); max-width: 40rem; }
.tile {
  width: var(--ts); height: var(--ts); border-radius: 18px; display: grid; place-items: center; touch-action: none; user-select: none; -webkit-user-select: none;
  font-family: var(--display); font-size: calc(var(--ts) * .48); color: #fff; background: var(--tc, var(--gc));
  box-shadow: 0 6px 0 rgba(0, 0, 0, .18), 0 10px 18px rgba(27, 30, 60, .15); transition: transform .25s var(--spring), opacity .2s; animation: tileIn .5s var(--spring) both; animation-delay: calc(var(--i) * 45ms); cursor: grab;
}
.tile:active { transform: translateY(3px) scale(.96); }
.tile.used { opacity: .18; transform: scale(.85); pointer-events: none; box-shadow: none; }
@keyframes tileIn { from { opacity: 0; transform: translateY(30px) scale(.4) rotate(-20deg); } }
.drag-ghost { position: fixed !important; z-index: 999; pointer-events: none; transform: scale(1.12) rotate(-4deg) !important; box-shadow: 0 20px 40px rgba(27, 30, 60, .3) !important; opacity: .96; animation: none !important; margin: 0 !important; }
.drag-src { opacity: .35; }

/* -------------------------------- WORD MATCH -------------------------------- */
.mt-timer { display: flex; align-items: center; gap: .5rem; flex: none; margin: .2rem 0 .5rem; }
.mt-timer .g-progress { flex: 1; }
.mt-timer .g-progress i { transition: width 1s linear, background .3s; }
.mt-timer.low .g-progress i { background: var(--red); }
.mt-timer b { font-family: var(--display); min-width: 2.5rem; text-align: right; }
.mt-timer.low b { color: var(--red); animation: pop .6s infinite; }
.match-board { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: clamp(.6rem, 2.5vw, 2.5rem); align-content: center; min-height: 0; position: relative; }
.match-col { display: flex; flex-direction: column; gap: clamp(.45rem, 1.3vh, .8rem); }
.match-col h4 { text-align: center; font-size: .78rem; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; margin-bottom: .1rem; }
.mcard {
  position: relative; min-height: clamp(2.9rem, 8.2vh, 4.4rem); padding: .4rem .7rem; border-radius: 18px; background: #fff; border: 3px solid var(--line);
  box-shadow: 0 5px 0 var(--line); display: flex; align-items: center; justify-content: center; gap: .4rem; text-align: center;
  font-weight: 800; font-size: clamp(.85rem, 1.9vh, 1.15rem); line-height: 1.15; transition: transform .2s var(--spring), border .2s, background .2s, box-shadow .2s, opacity .4s;
  touch-action: none; user-select: none; -webkit-user-select: none; animation: cardIn .5s var(--spring) both; animation-delay: calc(var(--i) * 60ms); cursor: pointer;
}
.mcard.en { font-family: var(--display); font-weight: 600; font-size: clamp(.95rem, 2.1vh, 1.3rem); }
.mcard .speak { width: 1.8rem; height: 1.8rem; position: absolute; left: .4rem; }
.mcard.en { padding-left: 2.5rem; }
.mcard:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--line); }
.mcard.sel { border-color: var(--gc); background: var(--gl); box-shadow: 0 5px 0 color-mix(in srgb, var(--gc) 45%, white); transform: translateY(-3px) scale(1.02); }
.mcard.hover { border-color: var(--gc); transform: scale(1.04); }
.mcard.ok { border-color: var(--green); background: var(--green-l); color: var(--green-d); box-shadow: 0 5px 0 #A7EBC0; animation: matchOk .6s var(--spring) both; pointer-events: none; }
.mcard.gone { opacity: .35; transform: scale(.94); }
.mcard.no { border-color: var(--red); background: var(--red-l); color: var(--red-d); }
@keyframes cardIn { from { opacity: 0; transform: translateY(24px) scale(.85); } }
@keyframes matchOk { 30% { transform: scale(1.08); } 100% { transform: scale(1); } }

/* ---------------------------------- WORDLE ---------------------------------- */
.wd-board { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; padding: .4rem 0; }
.wd-grid { display: grid; gap: clamp(4px, .8vh, 8px); }
.wd-row { display: grid; grid-template-columns: repeat(var(--n), var(--ts)); gap: clamp(4px, .8vh, 8px); }
.wd-row.shake { animation: shake .45s; }
.wd-row.win .wd-tile { animation: winHop .6s var(--spring) both; animation-delay: calc(var(--i) * 90ms); }
.wd-tile {
  width: var(--ts); height: var(--ts); border-radius: 12px; border: 3px solid var(--line); background: #fff;
  display: grid; place-items: center; font-family: var(--display); font-size: calc(var(--ts) * .5); text-transform: uppercase; transition: border-color .15s;
}
.wd-tile.filled { border-color: #B9BDD3; animation: tilePop .14s; }
.wd-tile.rev { animation: flipIn .6s ease both; animation-delay: calc(var(--i) * 230ms); }
.wd-tile.g { --tb: var(--green); }
.wd-tile.o { --tb: #F59E0B; }
.wd-tile.x { --tb: var(--gray-tile); }
.wd-tile.done { background: var(--tb); border-color: var(--tb); color: #fff; }
.wd-row.current .wd-tile:not(.filled) { border-color: #E2E4F0; background: #FCFCFF; }
@keyframes tilePop { 50% { transform: scale(1.12); } }
@keyframes flipIn { 0% { transform: rotateX(0); } 49% { transform: rotateX(90deg); background: #fff; border-color: #B9BDD3; color: var(--ink); } 50% { transform: rotateX(90deg); background: var(--tb); border-color: var(--tb); color: #fff; } 100% { transform: rotateX(0); background: var(--tb); border-color: var(--tb); color: #fff; } }
@keyframes winHop { 40% { transform: translateY(-18px); } 70% { transform: translateY(4px); } }
.tries { display: inline-flex; align-items: center; gap: .3rem; padding: .25rem .7rem; border-radius: 99px; background: var(--gl); color: var(--gd); font-weight: 900; font-size: .8rem; }
.tries i { width: .55rem; height: .55rem; border-radius: 50%; background: var(--gc); }
.tries i.off { background: #D5D8E8; }
.kb { display: grid; gap: clamp(4px, .8vh, 8px); flex: none; padding-bottom: .3rem; user-select: none; -webkit-user-select: none; }
.kb-row { display: flex; justify-content: center; gap: clamp(3px, .6vw, 7px); }
.key {
  flex: 1; max-width: 3.4rem; height: clamp(2.8rem, 6.3vh, 3.9rem); border-radius: 12px; background: #fff; border: 2px solid var(--line);
  box-shadow: 0 4px 0 var(--line); font-family: var(--display); font-size: clamp(.95rem, 2.2vh, 1.25rem); display: grid; place-items: center; transition: background .3s, transform .1s, box-shadow .1s;
}
.key.wide { max-width: 5.6rem; flex: 1.6; font-size: .8rem; }
.key .ic { width: 1.4rem; height: 1.4rem; }
.key:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.key.g { background: var(--green); border-color: var(--green-d); color: #fff; box-shadow: 0 4px 0 var(--green-d); }
.key.o { background: #F59E0B; border-color: #D97706; color: #fff; box-shadow: 0 4px 0 #C2710C; }
.key.x { background: #C7CADB; border-color: #B3B7CB; color: #fff; box-shadow: 0 4px 0 #A5A9BF; }
.wd-legend { display: flex; gap: .8rem; justify-content: center; font-size: .75rem; font-weight: 800; color: var(--muted); flex-wrap: wrap; }
.wd-legend span { display: inline-flex; align-items: center; gap: .3rem; }
.wd-legend i { width: .9rem; height: .9rem; border-radius: 4px; display: inline-block; }

/* ----------------------------------- QUIZ ----------------------------------- */
.qz-card { background: #fff; border-radius: 26px; padding: 1.3rem; box-shadow: var(--shadow); border: 1px solid var(--line); animation: qIn .5s var(--spring) both; flex: none; }
@keyframes qIn { from { opacity: 0; transform: translateX(40px) scale(.96); } }
.qz-meta { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: .7rem; }
.qz-q { font-family: var(--display); font-weight: 600; font-size: clamp(1.25rem, 3vh, 1.8rem); line-height: 1.3; }
.qz-q .blank { display: inline-block; min-width: 3.5em; border-bottom: 4px solid var(--gc); margin: 0 .15em; height: 1em; vertical-align: baseline; }
.qz-opts { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; margin-top: 1rem; flex: none; }
@media (max-width: 640px) { .qz-opts { grid-template-columns: 1fr; gap: .6rem; } }
.opt {
  display: flex; align-items: center; gap: .8rem; padding: .85rem 1rem; border-radius: 18px; background: #fff; border: 3px solid var(--line);
  box-shadow: 0 5px 0 var(--line); text-align: left; font-weight: 800; font-size: clamp(.95rem, 2.1vh, 1.2rem); transition: transform .15s, border .2s, background .2s, box-shadow .15s; animation: cardIn .45s var(--spring) both; animation-delay: calc(var(--i) * 70ms + .15s);
}
.opt:hover { border-color: color-mix(in srgb, var(--gc) 50%, white); }
.opt:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--line); }
.opt .ol { width: 2.2rem; height: 2.2rem; border-radius: 12px; flex: none; display: grid; place-items: center; background: var(--line-2); font-family: var(--display); color: var(--ink-2); transition: all .2s; }
.opt.ok { border-color: var(--green); background: var(--green-l); box-shadow: 0 5px 0 #A7EBC0; animation: matchOk .5s var(--spring); }
.opt.ok .ol { background: var(--green); color: #fff; }
.opt.no { border-color: var(--red); background: var(--red-l); box-shadow: 0 5px 0 #F7B5BB; }
.opt.no .ol { background: var(--red); color: #fff; }
.opt.dim { opacity: .45; }
.opt:disabled { cursor: default; }
.report { display: grid; gap: .8rem; margin-top: .4rem; text-align: left; }
.report .r-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: .5rem; }
.report .r-row div { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: .6rem; text-align: center; }
.report .r-row b { display: block; font-family: var(--display); font-size: 1.3rem; }
.report .r-row small { color: var(--muted); font-weight: 800; font-size: .72rem; }
.report h4 { font-size: 1rem; margin-bottom: .4rem; display: flex; align-items: center; gap: .4rem; }
.report .tags { display: flex; flex-wrap: wrap; gap: .4rem; }
.tag-weak { background: var(--red-l); color: var(--red-d); }
.tag-strong { background: var(--green-l); color: var(--green-d); }
@media (max-width: 520px) { .report .r-row { grid-template-columns: repeat(2, 1fr); } }

/* ----------------------------- SENTENCE BUILDER ----------------------------- */
.sb-area { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: clamp(1rem, 3vh, 2rem); min-height: 0; }
.sb-answer {
  min-height: 7.5rem; border-radius: 24px; background: #fff; border: 3px dashed #D5D8E8; padding: .9rem; display: flex; flex-wrap: wrap; align-content: flex-start; gap: .55rem;
  position: relative; transition: border .25s, background .25s; background-image: repeating-linear-gradient(transparent 0 3.05rem, #EEF0F7 3.05rem 3.2rem);
}
.sb-answer.hover { border-color: var(--gc); background-color: var(--gl); }
.sb-answer.ok { border-style: solid; border-color: var(--green); background: var(--green-l); }
.sb-answer.no { border-style: solid; border-color: var(--red); animation: shake .45s; }
.sb-answer .ph { position: absolute; inset: 0; display: grid; place-items: center; color: #B7BBD0; font-weight: 800; pointer-events: none; }
.sb-pool { display: flex; flex-wrap: wrap; justify-content: center; gap: .6rem; min-height: 3.2rem; }
.wchip {
  padding: .6rem 1rem; border-radius: 14px; background: #fff; border: 2px solid var(--line); box-shadow: 0 4px 0 var(--line); font-weight: 800;
  font-size: clamp(1rem, 2.3vh, 1.35rem); touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; transition: transform .2s var(--spring), background .2s, border .2s, opacity .2s; animation: cardIn .45s var(--spring) both; animation-delay: calc(var(--i) * 45ms);
}
.wchip:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.sb-answer .wchip { background: var(--gl); border-color: color-mix(in srgb, var(--gc) 40%, white); box-shadow: 0 4px 0 color-mix(in srgb, var(--gc) 35%, white); animation: slotIn .3s var(--spring); }
.wchip.ok { background: var(--green) !important; border-color: var(--green-d) !important; color: #fff; box-shadow: 0 4px 0 var(--green-d) !important; animation: wavey .55s var(--spring) both; animation-delay: calc(var(--i) * 60ms); }
.wchip.good { background: var(--green-l) !important; border-color: var(--green) !important; color: var(--green-d); }
.wchip.bad { background: var(--red-l) !important; border-color: var(--red) !important; color: var(--red-d); }
.wchip.locked { background: #FFF6DE !important; border-color: #F59E0B !important; color: #92400E; cursor: default; }
.ins-mark { width: 4px; align-self: stretch; min-height: 2.6rem; border-radius: 4px; background: var(--gc); animation: blinkbar .8s infinite; }
@keyframes blinkbar { 50% { opacity: .3; } }
.sb-end { font-family: var(--display); font-size: 1.4rem; color: var(--muted); align-self: flex-end; padding-bottom: .4rem; }

/* -------------------------------- WORD CIRCLE -------------------------------- */
.ci-wrap { flex: 1; display: grid; grid-template-rows: minmax(0, 1fr) auto auto; gap: .4rem; min-height: 0; }
@media (min-aspect-ratio: 5/4) and (min-width: 900px) {
  .ci-wrap { grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: minmax(0, 1fr) auto auto minmax(0, 1fr); column-gap: 3rem; }
  .ci-words { grid-row: 1 / 5; grid-column: 1; }
  .ci-bar { grid-row: 2; grid-column: 2; }
  .ci-wheel-area { grid-row: 3; grid-column: 2; }
}
.ci-bar { display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
.ci-tool { flex: none; width: 3.6rem; display: flex; flex-direction: column; align-items: center; gap: .1rem; padding: .45rem .2rem; border-radius: 16px; background: #fff; border: 2px solid var(--line); box-shadow: 0 4px 0 var(--line); color: var(--ink-2); transition: transform .12s, box-shadow .12s; }
.ci-tool .ic { width: 1.4rem; height: 1.4rem; }
.ci-tool small { font-size: .62rem; font-weight: 900; color: var(--muted); white-space: nowrap; }
.ci-tool:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.ci-tool.hint .ic { color: #F59E0B; }
.coin-pill { cursor: pointer; }
.hint-pill { cursor: pointer; color: #B45309; border-color: #FDE68A; box-shadow: 0 3px 0 #FDE68A; background: #FFFBEB; }
.hint-pill .ic { color: #F59E0B !important; }
.hint-pill:disabled { opacity: .45; }
.hint-pill:active { transform: translateY(2px); box-shadow: none; }
@media (max-width: 420px) { .hint-pill .hp-l { display: none; } .g-top .score-pill { padding: .4rem .7rem; font-size: .95rem; } }
.ci-words { display: flex; flex-wrap: wrap; align-content: center; justify-content: center; gap: .55rem 1.1rem; min-height: 0; overflow-y: auto; padding: .3rem; }
.ci-word { display: flex; gap: 4px; cursor: default; padding: 3px; border-radius: 10px; transition: background .2s; }
.ci-word.found { cursor: pointer; }
.ci-word.found:hover { background: var(--gl); }
.ci-box { width: var(--bs); height: var(--bs); border-radius: 8px; background: #fff; border: 2px solid #DCDFEC; display: grid; place-items: center; font-family: var(--display); font-size: calc(var(--bs) * .56); color: transparent; transition: all .3s; }
.ci-box.hint { color: #B45309; background: #FFF6DE; border-color: #F59E0B; }
.ci-word.found .ci-box { background: var(--gc); border-color: var(--gd); color: #fff; animation: boxIn .5s var(--spring) both; animation-delay: calc(var(--i) * 70ms); }
.ci-word.main .ci-box { --bs: calc(var(--bsb) * 1.12); }
.ci-word.flash .ci-box { animation: flash .6s; }
@keyframes boxIn { from { transform: scale(.3) rotate(-30deg); } }
@keyframes flash { 50% { background: var(--gold); border-color: #EAB308; transform: scale(1.15); color: #fff; } }
.ci-preview { flex: 1; min-width: 0; height: 3.2rem; display: flex; align-items: center; justify-content: center; gap: 3px; }
.ci-preview span { min-width: 1.95rem; height: 2.4rem; padding: 0 .25rem; border-radius: 10px; background: var(--gc); color: #fff; font-family: var(--display); font-size: 1.3rem; display: grid; place-items: center; animation: slotIn .2s var(--spring); box-shadow: 0 4px 0 var(--gd); }
.ci-preview.bad span { background: var(--red); box-shadow: 0 4px 0 var(--red-d); animation: shake .4s; }
.ci-preview.good span { background: var(--green); box-shadow: 0 4px 0 var(--green-d); animation: wavey .5s var(--spring); }
.ci-preview.dup span { background: #F59E0B; box-shadow: 0 4px 0 #C2710C; }
.ci-wheel-area { display: flex; align-items: center; justify-content: center; flex: none; padding-bottom: .3rem; }
.wheel { position: relative; width: var(--ws); height: var(--ws); border-radius: 50%; touch-action: none; user-select: none; -webkit-user-select: none; flex: none; }
.wheel::before { content: ''; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 50% 40%, #fff 0%, #F4F1FF 70%); box-shadow: inset 0 0 0 3px #EAE5FF, 0 18px 40px rgba(109, 93, 252, .18); }
.wheel svg.lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.wheel svg.lines path { fill: none; stroke: var(--gc); stroke-width: calc(var(--ws) * .035); stroke-linecap: round; stroke-linejoin: round; opacity: .85; }
.wl {
  position: absolute; width: var(--ls); height: var(--ls); margin: calc(var(--ls) / -2) 0 0 calc(var(--ls) / -2); border-radius: 50%;
  display: grid; place-items: center; font-family: var(--display); font-size: calc(var(--ls) * .5); color: var(--ink); background: #fff;
  box-shadow: 0 5px 0 #E3DEFF, 0 8px 18px rgba(109, 93, 252, .15); border: 3px solid #EAE5FF; transition: left .5s var(--spring), top .5s var(--spring), transform .2s var(--spring), background .15s, color .15s; z-index: 2;
}
.wl.on { background: var(--gc); color: #fff; border-color: var(--gd); box-shadow: 0 5px 0 var(--gd), 0 0 0 6px color-mix(in srgb, var(--gc) 20%, transparent); transform: scale(1.12); }

.set-row:last-child { border-bottom: 0; }
.set-row .s-ic { width: 2.4rem; height: 2.4rem; border-radius: 12px; display: grid; place-items: center; background: var(--primary-l); color: var(--primary); flex: none; }
.set-row .s-txt { flex: 1; min-width: 0; }
.set-row .s-txt b { display: block; }
.set-row .s-txt small { color: var(--muted); font-weight: 700; }
.switch { width: 3.4rem; height: 2rem; border-radius: 99px; background: #D9DCE8; position: relative; transition: background .25s; flex: none; }
.switch::after { content: ''; position: absolute; left: .2rem; top: .2rem; width: 1.6rem; height: 1.6rem; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, .2); transition: transform .3s var(--spring); }
.switch.on { background: var(--green); }
.switch.on::after { transform: translateX(1.4rem); }
input[type=range] { width: 8rem; accent-color: var(--primary); }

.bt-score { display: grid; grid-template-columns: 1fr auto 1fr; gap: .8rem; align-items: center; flex: none; margin-bottom: .6rem; }
.bt-team { border-radius: 20px; padding: .6rem 1rem; color: #fff; display: flex; align-items: center; justify-content: space-between; gap: .6rem; transition: transform .35s var(--spring), box-shadow .3s, opacity .3s; opacity: .55; }
.bt-team.active { opacity: 1; transform: scale(1.04); box-shadow: 0 12px 26px rgba(27, 30, 60, .22); }
.bt-team b { font-family: var(--display); font-size: 1.15rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bt-team .sc { font-family: var(--display); font-size: 2rem; }
.bt-team.a { background: linear-gradient(135deg, #FB7185, #E11D48); }
.bt-team.b { background: linear-gradient(135deg, #60A5FA, #2563EB); }
.bt-vs { font-family: var(--display); color: var(--muted); font-size: 1.2rem; }
.bt-turn { text-align: center; font-family: var(--display); font-size: 1.2rem; margin: .2rem 0 .5rem; animation: popIn .4s var(--spring); }
.team-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; width: min(32rem, 100%); }
.team-inputs input { width: 100%; padding: .8rem 1rem; border-radius: 16px; border: 3px solid var(--line); font-weight: 800; text-align: center; font-family: var(--display); font-size: 1.1rem; outline: none; }
.team-inputs input.a { border-color: #FDA4AF; }
.team-inputs input.b { border-color: #93C5FD; }

/* ---------------------------------- final exam ---------------------------------- */
.fx-type { display: inline-flex; align-items: center; gap: .35rem; }
.mini-match { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; margin-top: 1rem; }
.mini-match .mcard { min-height: 3.3rem; }
.listen-big { width: 6rem; height: 6rem; margin: .6rem auto; display: grid; place-items: center; border-radius: 50%; background: var(--gc); color: #fff; box-shadow: 0 8px 0 var(--gd), 0 16px 30px rgba(27, 30, 60, .2); transition: transform .15s; }
.listen-big:active { transform: translateY(5px); box-shadow: 0 3px 0 var(--gd); }
.listen-big .ic { width: 2.8rem; height: 2.8rem; }
.listen-big.speaking { animation: pulse 1s infinite; }

/* ---------------------------------- quest map ---------------------------------- */
.qchap { display: flex; align-items: center; gap: .9rem; padding: .9rem 1.1rem; margin: 1.2rem auto .4rem; max-width: 34rem; border-radius: 22px; color: #fff; background: linear-gradient(135deg, #7B6BFF, #3B82F6); box-shadow: 0 14px 30px rgba(91, 75, 240, .25); animation: rise .5s var(--ease) both; }

.qchap .qc-bar i { display: block; height: 100%; background: #fff; border-radius: inherit; transition: width 1s var(--ease); }

.qstop { position: relative; display: flex; flex-direction: column; align-items: center; translate: var(--x) 0; animation: rise .5s var(--ease) both; }
.qnode { width: 4.4rem; height: 4.4rem; border-radius: 50%; display: grid; place-items: center; color: #fff; background: var(--gc); box-shadow: 0 7px 0 var(--gd), 0 12px 24px rgba(27, 30, 60, .18); transition: transform .2s var(--spring); }
.qnode .ic { width: 1.9rem; height: 1.9rem; }

.qnode.cur { width: 5.4rem; height: 5.4rem; animation: pop 1.6s infinite; box-shadow: 0 7px 0 var(--gd), 0 0 0 8px color-mix(in srgb, var(--gc) 22%, transparent), 0 14px 30px rgba(27, 30, 60, .2); }

.qnode.locked { background: #E5E7F0; color: #AEB3C8; box-shadow: 0 7px 0 #CDD0DE; }

.c-hint .pattern { font-family: var(--display); letter-spacing: .12em; }

.vp-hero { width: 4.6rem; height: 4.6rem; margin: 0 auto 1rem; border-radius: 24px; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, #8B7BFF, #5243E0); box-shadow: 0 14px 30px rgba(109, 93, 252, .35); animation: floaty 3.5s ease-in-out infinite; }

.peer .ic { width: .95rem; height: .95rem; }
.cl-form { gap: .6rem; }

.no-anim *, .no-anim { animation: none !important; }

@media (max-width: 999px) { body:has(input:focus) #nav { transform: translateY(115%); } }

/* ------------------------------------ misc ------------------------------------ */
.tip { display: flex; gap: .6rem; align-items: flex-start; padding: .8rem 1rem; border-radius: 16px; background: #FFF8E6; color: #92400E; font-weight: 700; font-size: .88rem; }
.tip .ic { color: #F59E0B; margin-top: .1rem; }
.divider { height: 1px; background: var(--line); margin: 1rem 0; }
.foot-note { text-align: center; color: var(--muted); font-size: .78rem; font-weight: 700; margin-top: 1.8rem; }

body.no-voice .speak, body.no-voice .listen-big, body.no-voice [data-listen], body.no-voice .voice-only { display: none !important; }
body.no-voice .wc-ex .tr { padding-left: 0; }
body.no-voice .mcard.en { padding-left: .7rem; }

body.reduce-motion *, body.reduce-motion *::before, body.reduce-motion *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .05s !important; }
body.reduce-motion #bg span, body.reduce-motion #bg i { display: none; }

@media (min-width: 1400px) {
  .screen.is-game { max-width: 1400px; }
}
@media (max-height: 640px) {
  .clue .c-main { font-size: 1.3rem; }
  .g-start .gs-art { width: 6rem; height: 6rem; }
}

const DB = {
  state: null,
  load() {
    let s = null;
    try { s = JSON.parse(localStorage.getItem(STORE_KEY)); } catch (e) { s = null; }
    if (!s || typeof s !== 'object') s = {};
    s.players = s.players || {};
    s.settings = Object.assign({ sound: true, voice: false, accent: 'us', rate: 0.9, motion: true, matchMode: 'timed', voiceId: '', voiceChosen: false, classServer: '' }, s.settings || {});
    // v3: only single WORDS are read aloud, and only when a speaker button is tapped
    if (s.settings.v !== 3) { s.settings.voice = true; s.settings.v = 3; }
    Object.values(s.players).forEach(migratePlayer);
    if (!s.current || !s.players[s.current]) s.current = Object.keys(s.players)[0] || null;
    this.state = s;
  },
  save() { clearTimeout(this._t); this._t = setTimeout(() => this.saveNow(), 120); },
  saveNow() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(this.state)); } catch (e) { /* storage full or blocked */ }
    try { if (typeof ClassNet !== 'undefined') ClassNet.push(); } catch (e) { }
  },
};
const S = () => DB.state.settings;
const P = () => (DB.state && DB.state.players[DB.state.current]) || null;

function blankGames() {
  const g = {};
  GAME_IDS.forEach(id => g[id] = { score: 0, best: 0, plays: 0, level: 1 });
  g.final = { best: 0, score: 0, plays: 0, last: null };
  return g;
}
function migratePlayer(p) {
  const d = {
    xp: 0, streak: { count: 0, last: null, best: 0 }, words: {}, mistakes: [], games: blankGames(),
    stats: { correct: 0, wrong: 0, bestCombo: 0, sentences: 0, circleWords: 0, circleLevels: 0, wordles: 0, wordleBest: 99, pairs: 0, fixed: 0, perfect: 0, speedMatch: 0, battles: 0, dailyAll: 0, games: 0, top1: 0 },
    topics: {}, daily: null, ach: {}, history: {}, recentQ: [], circleDone: [], connectDone: [],
    quest: { stage: 0, done: {} },
  };
  for (const k in d) if (p[k] === undefined) p[k] = d[k];
  for (const k in d.stats) if (p.stats[k] === undefined) p.stats[k] = d.stats[k];
  const bg = blankGames();
  for (const k in bg) p.games[k] = Object.assign(bg[k], p.games[k] || {});
  return p;
}
function createPlayer(name, avatar) {
  const p = migratePlayer({ id: 'p' + uid(), name: name.trim().slice(0, 18), avatar, created: Date.now() });
  DB.state.players[p.id] = p;
  DB.state.current = p.id;
  DB.saveNow();
  return p;
}
function switchPlayer(id) { if (DB.state.players[id]) { DB.state.current = id; DB.saveNow(); } }
function deletePlayer(id) {
  delete DB.state.players[id];
  DB.state.removed = [...(DB.state.removed || []), id]; // also remove from the class leaderboard
  if (DB.state.current === id) DB.state.current = Object.keys(DB.state.players)[0] || null;
  DB.saveNow();
}

/* ------------------------------ level & words ------------------------------ */
const LEVEL_TITLES = ['Newcomer', 'Newcomer', 'Explorer', 'Explorer', 'Learner', 'Learner', 'Scholar', 'Scholar', 'Scholar', 'Expert', 'Expert', 'Expert', 'Master', 'Master', 'Master', 'Champion', 'Champion', 'Champion', 'Champion', 'Legend'];
function xpNeeded(level) { return 120 + (level - 1) * 60; }
function levelInfo(xp) {
  let level = 1, rem = xp, need = xpNeeded(1);
  while (rem >= need) { rem -= need; level++; need = xpNeeded(level); }
  return { level, cur: rem, need, pct: rem / need, title: LEVEL_TITLES[Math.min(level - 1, LEVEL_TITLES.length - 1)] };
}
function wstat(p, id) { return p.words[id] || (p.words[id] = { c: 0, w: 0 }); }
const isLearned = ws => !!ws && (ws.k || ws.c >= 2);
function learnedCount(p = P()) { return VOCAB.filter(w => isLearned(p.words[w.id])).length; }
/* weight: words with more mistakes appear more often (smart mistake system) */
function wordWeight(p, id) {
  const ws = p.words[id];
  if (!ws) return 1.6;
  return clamp(1 + ws.w * 1.6 - Math.min(ws.c, 5) * 0.18 + (ws.k ? -0.3 : 0), 0.35, 9);
}
function pickWords(pool, n, p = P()) { return weightedSample(pool, n, w => wordWeight(p, w.id)); }
function studyWord(id) {
  const p = P(); if (!p || !id) return;
  const ws = wstat(p, id);
  ensureDaily(p);
  if (!p.daily.words.includes(id)) { p.daily.words.push(id); dailyEvent('learn', 1); }
  ws.seen = (ws.seen || 0) + 1;
}

/* ------------------------------- daily stuff ------------------------------- */
function dayStat(field, n = 1) {
  const p = P(); const k = todayKey();
  const h = p.history[k] || (p.history[k] = { c: 0, w: 0, xp: 0 });
  h[field] = (h[field] || 0) + n;
}
function touchStreak() {
  const p = P(); const t = todayKey();
  if (p.streak.last === t) return;
  p.streak.count = p.streak.last === yesterdayKey() ? p.streak.count + 1 : 1;
  p.streak.last = t;
  p.streak.best = Math.max(p.streak.best, p.streak.count);
  if (p.streak.count > 1) setTimeout(() => toast(`${p.streak.count}-day streak! Keep it up!`, 'streak'), 400);
}
function currentStreak(p = P()) {
  if (!p.streak.last) return 0;
  return (p.streak.last === todayKey() || p.streak.last === yesterdayKey()) ? p.streak.count : 0;
}
function ensureDaily(p = P()) {
  const t = todayKey();
  if (p.daily && p.daily.date === t) return p.daily;
  const rng = seeded(hashStr(t + p.id));
  const ids = DAILY_TEMPLATES.map(d => d.id).sort(() => rng() - 0.5).slice(0, 4);
  p.daily = { date: t, ids, prog: {}, claimed: [], words: [], allDone: false };
  return p.daily;
}
function dailyEvent(event, amount = 1) {
  const p = P(); if (!p) return;
  const d = ensureDaily(p);
  d.ids.forEach(id => {
    const tpl = DAILY_TEMPLATES.find(x => x.id === id);
    if (!tpl || tpl.event !== event) return;
    const before = d.prog[id] || 0;
    if (before >= tpl.target) return;
    const now = tpl.max ? Math.max(before, amount) : before + amount;
    d.prog[id] = Math.min(now, tpl.target);
    if (d.prog[id] >= tpl.target) setTimeout(() => toast(`Daily challenge complete: ${tpl.title}`, 'daily'), 300);
  });
}
function dailyReadyCount(p = P()) {
  const d = ensureDaily(p);
  return d.ids.filter(id => { const t = DAILY_TEMPLATES.find(x => x.id === id); return (d.prog[id] || 0) >= t.target && !d.claimed.includes(id); }).length;
}
