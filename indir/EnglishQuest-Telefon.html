function checkAchievements() {
  const p = P(); if (!p) return [];
  const got = [];
  ACHIEVEMENTS.forEach(a => {
    if (p.ach[a.id]) return;
    const [c, t] = a.prog(p);
    if (c >= t) { p.ach[a.id] = Date.now(); got.push(a); }
  });
  got.forEach((a, i) => setTimeout(() => { achievementToast(a); SFX.badge(); }, 700 + i * 1300));
  if (got.length) { addXP(got.length * 25, { quiet: true }); DB.save(); }
  return got;
}

/* --------------------------------- XP --------------------------------- */
let pendingLevelUp = null;
function addXP(n, opts = {}) {
  const p = P(); if (!p || n <= 0) return;
  const before = levelInfo(p.xp).level;
  p.xp += n;
  dayStat('xp', n);
  dailyEvent('xp', n);
  touchStreak();
  const after = levelInfo(p.xp).level;
  if (after > before) {
    pendingLevelUp = after;
    if (!Game.s && !opts.defer) setTimeout(flushLevelUp, 600);
  }
  updateHUD();
  DB.save();
}
function flushLevelUp() {
  if (!pendingLevelUp || Game.s) return;
  const lv = pendingLevelUp; pendingLevelUp = null;
  const info = levelInfo(P().xp);
  SFX.levelUp(); FX.rain();
  modal(`
    <div class="levelup">
      <div class="lu-burst"></div>
      <div class="lu-badge"><span>${lv}</span></div>
      <h2>Level Up!</h2>
      <p>You reached <b>Level ${lv}</b> — <b>${info.title}</b></p>
      <p class="muted small">New challenges unlocked. Keep going!</p>
      <button class="btn big" data-close>${icon('sparkles')} Awesome!</button>
    </div>`, { cls: 'center' });
}

/* ------------------------------- QUEST (continuity) -------------------------------
   An endless path: every chapter plays all games in order and ends with an exam.
   Difficulty grows chapter by chapter, so the game never "ends".            */
const QUEST_STEPS = ['connect', 'match', 'riddle', 'wordle', 'circle', 'sentence', 'quiz', 'final'];
function questStage(i) {
  const n = QUEST_STEPS.length;
  const chapter = Math.floor(i / n) + 1, step = i % n, game = QUEST_STEPS[step];
  const band = chapter <= 2 ? 'easy' : chapter <= 4 ? 'medium' : 'hard';
  return {
    index: i, chapter, step, game, band,
    connectLevel: ((chapter - 1) % 8) + 1,
    circleLevel: ((chapter - 1) % 16) + 1,
    matchMode: chapter === 1 ? 'relaxed' : 'timed',
  };
}
function questLabel(st) { return `Quest · Chapter ${st.chapter} · Stage ${st.step + 1}/${QUEST_STEPS.length}`; }
function questRoute(st) { return `play/${st.game}/quest`; }

/* -------------------------------- leaderboards -------------------------------- */
/* one player's leaderboard numbers (this is also what is sent to the class server) */
function playerSummary(p) {
  const scores = {};
  GAME_IDS.forEach(g => { scores[g] = Math.round((p.games[g] && p.games[g].score) || 0); });
  scores.final = Math.round(p.games.final.best || 0);
  return { id: p.id, name: p.name, avatar: p.avatar, created: p.created, xp: Math.round(p.xp), scores };
}
/* every leaderboard = players on this device + players of the class (other devices) */
function board(game) {
  const local = Object.values(DB.state.players).map(p => ({ s: playerSummary(p), remote: false }));
  const remote = ClassNet.remote.map(s => ({ s, remote: true }));
  return [...local, ...remote]
    .map(({ s, remote }) => ({ p: { id: s.id, name: s.name, avatar: s.avatar, created: s.created || 0, xp: s.xp || 0 }, v: game === 'overall' ? (s.xp || 0) : ((s.scores && s.scores[game]) || 0), remote }))
    .sort((a, b) => b.v - a.v || a.p.created - b.p.created)
    .map((x, i) => ({ ...x, rank: i + 1 }));
}

/* --------------------------- CLASS LEADERBOARD (shared) ---------------------------
   A computer that runs Baslat.bat (tools/serve.js) is the class score server.
   Every device on the same Wi-Fi sends its players' scores there and reads all the
   others, so phones, the smart board and computers share ONE leaderboard per game.
   No accounts and no internet service: the names stay inside the school network. */
const ClassNet = {
  connected: false, remote: [], info: null, lastSent: '', _t: 0, onChange: null,
  normalize(addr) {
    let a = String(addr || '').trim().replace(/\s+/g, '');
    if (!a) return '';
    if (!/^https?:\/\//i.test(a)) a = 'http://' + a;
    a = a.replace(/\/+$/, '');
    if (!/:\d+$/.test(a.replace(/^https?:\/\//i, ''))) a += ':5173';
    return a;
  },
  base() {
    if (S().classServer) return S().classServer;
    if (/^https?:$/.test(location.protocol) && location.port === '5173') return location.origin; // opened from the server itself
    return '';
  },
  async req(path, body, base = this.base()) {
    if (!base) throw new Error('no class server');
    const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const timer = setTimeout(() => ctl && ctl.abort(), 4000);
    try {
      const r = await fetch(base + path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal: ctl && ctl.signal } : { signal: ctl && ctl.signal });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await r.json();
    } finally { clearTimeout(timer); }
  },
  /* true only on the computer that runs the server (never inside the phone app) */
  isHost() {
    if (!this.connected || !this.info || !this.info.host || TARGET === 'app' || TARGET === 'phone') return false;
    return location.protocol === 'file:' || /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
  },
  setRemote(list) {
    const local = new Set(Object.keys(DB.state.players));
    this.remote = (Array.isArray(list) ? list : []).filter(x => x && x.id && !local.has(x.id) && typeof x.name === 'string');
    if (this.onChange) this.onChange();
  },
  async test(addr) {
    const base = this.normalize(addr);
    const info = await this.req('/api/ping', null, base);
    if (!info || info.app !== 'english-quest') throw new Error('This address is not an English Quest class server');
    return { base, info };
  },
  async connect() {
    if (!this.base()) { this.connected = false; return false; }
    try {
      this.info = await this.req('/api/ping');
      this.connected = !!(this.info && this.info.app === 'english-quest');
    } catch (e) { this.connected = false; }
    if (this.connected) { this.lastSent = ''; await this.pushNow(); }
    return this.connected;
  },
  async pull() {
    if (!this.base()) return;
    try { const r = await this.req('/api/scores'); this.connected = true; this.setRemote(r.players); }
    catch (e) { this.connected = false; }
  },
  async pushNow() {
    if (!this.base()) return;
    const players = Object.values(DB.state.players).map(playerSummary);
    const key = JSON.stringify(players);
    try {
      const r = await this.req('/api/scores', { players, removed: DB.state.removed || [] });
      this.connected = true; this.lastSent = key; DB.state.removed = [];
      this.setRemote(r.players);
    } catch (e) { this.connected = false; }
  },
  /* called whenever progress is saved: sends only when a score really changed */
  push() {
    if (!this.base()) return;
    const key = JSON.stringify(Object.values(DB.state.players).map(playerSummary));
    if (key === this.lastSent) return;
    clearTimeout(this._t);
    this._t = setTimeout(() => this.pushNow(), 700);
  },
};
function rankOf(pid, game) { const b = board(game); const e = b.find(x => x.p.id === pid); return e ? e.rank : b.length + 1; }

/* -------------------------------- game session -------------------------------- */
const Game = {
  s: null,
  start(game, opts = {}) {
    this.s = { game, opts, score: 0, correct: 0, wrong: 0, combo: 0, maxCombo: 0, xp: 0, t0: Date.now(), wordsOk: new Set(), wordsBad: new Set(), topicsOk: {}, topicsBad: {}, wrongList: [] };
    return this.s;
  },
  /* correct answer → points, xp, combo, word stats */
  correct({ wordId = null, points = 100, el = null, topic = null } = {}) {
    const s = this.s, p = P(); if (!s || !p) return 0;
    s.correct++; s.combo++; s.maxCombo = Math.max(s.maxCombo, s.combo);
    const comboBonus = Math.min(s.combo - 1, 10) * 10;
    const pts = Math.round(points + comboBonus);
    const xp = 10 + Math.min((s.combo - 1) * 2, 10);
    s.score += pts; s.xp += xp;
    p.stats.correct++;
    p.stats.bestCombo = Math.max(p.stats.bestCombo, s.combo);
    dailyEvent('combo', s.combo);
    dayStat('c');
    if (wordId) { const ws = wstat(p, wordId); ws.c++; ws.last = Date.now(); s.wordsOk.add(wordId); studyWord(wordId); }
    if (topic) { const t = p.topics[topic] || (p.topics[topic] = { c: 0, w: 0 }); t.c++; s.topicsOk[topic] = (s.topicsOk[topic] || 0) + 1; }
    addXP(xp, { defer: true });
    if (el) FX.float(el, `+${pts}`, 'good');
    if (s.combo >= 3) FX.combo(s.combo);
    SFX.correct(); buzz(18);
    DB.save();
    return pts;
  },
  /* wrong answer → combo reset, mistake recorded (smart mistake system) */
  wrong({ wordId = null, topic = null, el = null, mistake = null, penalty = 0 } = {}) {
    const s = this.s, p = P(); if (!s || !p) return;
    s.wrong++; s.combo = 0;
    if (penalty) s.score = Math.max(0, s.score - penalty);
    p.stats.wrong++;
    dayStat('w');
    if (wordId) { const ws = wstat(p, wordId); ws.w++; ws.lastWrong = Date.now(); s.wordsBad.add(wordId); }
    if (topic) { const t = p.topics[topic] || (p.topics[topic] = { c: 0, w: 0 }); t.w++; s.topicsBad[topic] = (s.topicsBad[topic] || 0) + 1; }
    if (mistake) {
      const m = Object.assign({ id: uid(), game: s.game, t: Date.now(), wordId, topic, fixed: false }, mistake);
      p.mistakes.unshift(m);
      if (p.mistakes.length > 300) p.mistakes.length = 300;
      s.wrongList.push(m);
    }
    if (el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
    SFX.wrong(); buzz([30, 40, 30]);
    DB.save();
  },
  /* end of a session → save score, rank change, results */
  finish(extra = {}) {
    const s = this.s, p = P(); if (!s || !p) return null;
    const g = s.game;
    const rankBefore = rankOf(p.id, g === 'final' ? 'final' : g);
    const overallBefore = rankOf(p.id, 'overall');
    const total = s.correct + s.wrong;
    const accuracy = total ? Math.round((s.correct / total) * 100) : 0;
    let bonusXP = 20 + (accuracy >= 100 ? 20 : accuracy >= 80 ? 10 : 0);
    if (extra.bonusXP) bonusXP += extra.bonusXP;
    const rec = p.games[g];
    if (rec) {
      if (g === 'final') {
        rec.best = Math.max(rec.best, extra.percent || 0); rec.plays++; rec.last = extra.percent || 0;
        rec.score = Math.max(rec.score, s.score);
      } else {
        rec.score += s.score; rec.best = Math.max(rec.best, s.score); rec.plays++;
      }
    }
    if (GAME_IDS.includes(g)) { p.stats.games++; dailyEvent('game', 1); }
    s.bonusXP = bonusXP;
    addXP(bonusXP, { defer: true });
    const rankAfter = rankOf(p.id, g === 'final' ? 'final' : g);
    const overallAfter = rankOf(p.id, 'overall');
    if (board('overall').length > 1 && (rankAfter === 1 || overallAfter === 1)) p.stats.top1 = 1;
    const result = { game: g, score: s.score, correct: s.correct, wrong: s.wrong, accuracy, maxCombo: s.maxCombo, xp: s.xp + bonusXP, rankBefore, rankAfter, overallBefore, overallAfter, time: Math.round((Date.now() - s.t0) / 1000), session: s };
    this.s = null;
    DB.saveNow();
    return result;
  },
  abort() { this.s = null; DB.save(); },
};

function countUp(node, to, dur = 800) {
  if (!S().motion) { node.textContent = fmt(to); return; }
  const t0 = performance.now();
  const step = t => { const k = clamp((t - t0) / dur, 0, 1); const e = 1 - Math.pow(1 - k, 3); node.textContent = fmt(to * e); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
  setTimeout(() => { node.textContent = fmt(to); }, dur + 150); // always end on the exact value
}

/* ---------------------------------- audio ---------------------------------- */
const SFX = {
  ctx: null,
  ensure() {
    if (!S().sound) return null;
    try {
      if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; this.ctx = new AC(); }
      if (this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e) { return null; }
    return this.ctx;
  },
  tone(freq, dur = 0.12, type = 'sine', vol = 0.14, delay = 0, slideTo = null) {
    const ctx = this.ensure(); if (!ctx) return;
    const t = ctx.currentTime + delay;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(t); o.stop(t + dur + 0.05);
  },
  /* short filtered noise burst → a crisp "tak" click */
  click(vol = 0.22, freq = 2400, dur = 0.035, delay = 0) {
    const ctx = this.ensure(); if (!ctx) return;
    if (!this.noise) {
      const len = Math.floor(ctx.sampleRate * 0.08);
      this.noise = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = this.noise.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    }
    const t = ctx.currentTime + delay;
    const src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = this.noise; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 1.4;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(ctx.destination);
    src.start(t); src.stop(t + dur + 0.02);
  },
  tap() { this.click(0.25, 2600); this.tone(620, 0.04, 'triangle', 0.05); },
  pop(i = 0) { this.click(0.2, 1800 + i * 120); this.tone(392 * Math.pow(2, (i * 2) / 12), 0.09, 'triangle', 0.12); },
  flip() { this.click(0.18, 1500, 0.05); this.tone(330, 0.05, 'triangle', 0.04); },
  correct() { this.tone(659, 0.1, 'triangle', 0.13); this.tone(880, 0.12, 'triangle', 0.13, 0.08); this.tone(1319, 0.2, 'sine', 0.09, 0.16); },
  wrong() { this.tone(240, 0.16, 'sawtooth', 0.05, 0, 170); this.tone(170, 0.22, 'square', 0.04, 0.1, 120); },
  coin() { this.tone(988, 0.07, 'square', 0.05); this.tone(1319, 0.16, 'square', 0.05, 0.07); },
  win() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.18, 'triangle', 0.12, i * 0.1)); this.tone(1568, 0.4, 'sine', 0.08, 0.42); },
  done() { [523, 659, 784].forEach((f, i) => this.tone(f, 0.16, 'triangle', 0.1, i * 0.1)); },
  levelUp() { [392, 523, 659, 784, 1047, 1319].forEach((f, i) => this.tone(f, 0.16, 'triangle', 0.12, i * 0.08)); },
  badge() { [784, 988, 1175, 1568].forEach((f, i) => this.tone(f, 0.14, 'sine', 0.1, i * 0.07)); },
  tick() { this.click(0.3, 3200, 0.03); this.tone(1200, 0.03, 'square', 0.025); },
  whoosh() { this.tone(300, 0.18, 'sine', 0.05, 0, 900); },
};
function buzz(p) {
  try {
    if (navigator.userActivation && !navigator.userActivation.hasBeenActive) return;
    if (navigator.vibrate && S().sound) navigator.vibrate(p);
  } catch (e) { }
}

/* ---------------------------------- speech ---------------------------------- */
/* build target: 'board' (PC / smart board file), 'phone' (phone file), 'app' (Android app) or 'web' */
const TARGET = window.EQ_TARGET || 'web';
const Speech = {
  voices: [],
  supported: typeof window !== 'undefined' && (!!window.AndroidTTS || 'speechSynthesis' in window),
  init() {
    if (!this.supported || !('speechSynthesis' in window)) return;
    const load = () => { this.voices = speechSynthesis.getVoices() || []; };
    load();
    try { speechSynthesis.addEventListener('voiceschanged', load); } catch (e) { speechSynthesis.onvoiceschanged = load; }
  },
  /* the voice chosen by the student (falls back to the best English voice) */
  voice() {
    const v = this.voices;
    const norm = x => (x.lang || '').replace('_', '-');
    if (S().voiceId) { const chosen = v.find(x => (x.voiceURI || x.name) === S().voiceId); if (chosen) return chosen; }
    const want = S().accent === 'uk' ? 'en-GB' : 'en-US';
    return v.find(x => norm(x) === want && /natural|online|google/i.test(x.name))
      || v.find(x => norm(x) === want)
      || v.find(x => norm(x).startsWith('en') && /natural|online|google/i.test(x.name))
      || v.find(x => norm(x).startsWith('en')) || null;
  },
  /* English voices on this device → [{id, label, lang}] (waits a little for them to load) */
  async list() {
    const accent = lang => ({ 'en-US': 'American', 'en-GB': 'British', 'en-AU': 'Australian', 'en-IN': 'Indian', 'en-CA': 'Canadian', 'en-IE': 'Irish', 'en-ZA': 'South African', 'en-NZ': 'New Zealand' }[lang] || 'English');
    const rank = lang => (lang === 'en-US' ? 0 : lang === 'en-GB' ? 1 : 2);
    let raw = [];
    if (window.AndroidTTS) {
      for (let i = 0; i < 30; i++) {
        try { raw = JSON.parse(window.AndroidTTS.voices() || '[]'); } catch (e) { raw = []; }
        if (raw.length || (window.AndroidTTS.ready && window.AndroidTTS.ready() && i > 3)) break;
        await sleep(150);
      }
      raw = raw.map(v => ({ id: v.name, lang: String(v.lang || '').replace('_', '-'), name: '' }));
    } else if ('speechSynthesis' in window) {
      for (let i = 0; i < 20 && !speechSynthesis.getVoices().length; i++) await sleep(100);
      this.voices = speechSynthesis.getVoices() || [];
      raw = this.voices.filter(v => /^en/i.test(v.lang)).map(v => ({ id: v.voiceURI || v.name, lang: v.lang.replace('_', '-'), name: v.name.replace(/^(Microsoft|Google)\s+/i, '').replace(/\s*-\s*English.*$/i, '').replace(/\s*\(.*\)$/, '').trim() }));
    }
    raw.sort((a, b) => rank(a.lang) - rank(b.lang) || a.lang.localeCompare(b.lang));
    const counts = {};
    return raw.slice(0, 12).map(v => {
      counts[v.lang] = (counts[v.lang] || 0) + 1;
      const a = accent(v.lang);
      return { id: v.id, lang: v.lang, label: v.name && !/^[a-z]{2}-[a-z]{2}-x-/i.test(v.name) ? `${v.name} · ${a}` : `${a} voice ${counts[v.lang]}` };
    });
  },
  say(text, btn) {
    if (!S().voice) { toast('Voice is turned off in Settings', 'info'); return; }
    if (!this.supported) { toast('Audio pronunciation is not supported on this device', 'info'); return; }
    const clean = String(text).replace(/\s*\(.*?\)\s*/g, ' ').trim();
    if (window.AndroidTTS) { // Android app: the phone's own text-to-speech
      let ok = false;
      try { ok = window.AndroidTTS.speak(clean, S().rate || 0.9, S().accent === 'uk' ? 'en-GB' : 'en-US', S().voiceId || ''); } catch (e) { }
      if (!ok) { toast('Ses için telefonda "Google Konuşma Hizmetleri" gerekli', 'info'); return; }
      if (btn) { btn.classList.add('speaking'); setTimeout(() => btn.classList.remove('speaking'), 1400); }
      return;
    }
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(clean);
      const v = this.voice();
      if (v) u.voice = v;
      u.lang = v ? v.lang : (S().accent === 'uk' ? 'en-GB' : 'en-US');
      u.rate = S().rate || 0.9; u.pitch = 1;
      if (btn) { btn.classList.add('speaking'); u.onend = u.onerror = () => btn.classList.remove('speaking'); setTimeout(() => btn.classList.remove('speaking'), 6000); }
      speechSynthesis.speak(u);
    } catch (e) { /* ignore */ }
  },
};

async function voicePicker(box, { onDone, doneLabel = 'Continue' } = {}) {
  box.innerHTML = `<div class="vp-loading">${icon('headphones')} Looking for English voices…</div>`;

  const draw = () => {

  init() {

  colors: ['#6D5DFC', '#EC4899', '#F59E0B', '#10B981', '#3B82F6', '#06B6D4', '#F43F5E', '#FACC15'],
  confetti({ x = innerWidth / 2, y = innerHeight * 0.35, count = 120, spread = 1 } = {}) {
    if (!S().motion) return;
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2, sp = (4 + Math.random() * 9) * spread;
      this.parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 6, g: 0.28, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4, w: 6 + Math.random() * 7, h: 4 + Math.random() * 6, c: pick(this.colors), life: 120 + Math.random() * 60, shape: Math.random() < 0.25 ? 'c' : 'r' });
    }
    this.run();
  },
  rain() {
    if (!S().motion) return;
    for (let i = 0; i < 160; i++) this.parts.push({ x: Math.random() * innerWidth, y: -20 - Math.random() * innerHeight * 0.6, vx: (Math.random() - 0.5) * 2, vy: 2 + Math.random() * 3, g: 0.05, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3, w: 7 + Math.random() * 6, h: 5 + Math.random() * 5, c: pick(this.colors), life: 260, shape: Math.random() < 0.3 ? 'c' : 'r' });
    this.run();
  },
  burst(el, count = 26) {
    if (!el || !S().motion) return;
    const r = el.getBoundingClientRect();
    this.confetti({ x: r.left + r.width / 2, y: r.top + r.height / 2, count, spread: 0.55 });
  },
  run() {
    if (this.raf) return;
    const tick = () => {
      const c = this.ctx; c.clearRect(0, 0, innerWidth, innerHeight);
      this.parts = this.parts.filter(p => p.life > 0 && p.y < innerHeight + 40);
      for (const p of this.parts) {
        p.vx *= 0.985; p.vy = p.vy * 0.985 + p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life--;
        c.save(); c.translate(p.x, p.y); c.rotate(p.rot); c.globalAlpha = Math.min(1, p.life / 40); c.fillStyle = p.c;
        if (p.shape === 'c') { c.beginPath(); c.arc(0, 0, p.w / 2.4, 0, Math.PI * 2); c.fill(); } else c.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.rot * 2)) + 1);
        c.restore();
      }
      if (this.parts.length) this.raf = requestAnimationFrame(tick); else { this.raf = 0; c.clearRect(0, 0, innerWidth, innerHeight); }
    };
    this.raf = requestAnimationFrame(tick);
  },
  float(el, text, kind = 'good') {

/* -------------------------------- pointer drag -------------------------------- */
/* Unified mouse/touch/pen drag helper. Calls onTap if the pointer barely moved. */
function makeDraggable(el, { onStart, onMove, onDrop, onTap, ghost = true, threshold = 8 } = {}) {
  el.addEventListener('pointerdown', e => {
    if (e.button !== undefined && e.button !== 0) return;
    const sx = e.clientX, sy = e.clientY;
    let dragging = false, g = null, ox = 0, oy = 0;
    const id = e.pointerId;
    const move = ev => {
      if (ev.pointerId !== id) return;
      const dx = ev.clientX - sx, dy = ev.clientY - sy;
      if (!dragging && Math.hypot(dx, dy) > threshold) {
        dragging = true;
        if (ghost) {
          const r = el.getBoundingClientRect();
          ox = sx - r.left; oy = sy - r.top;
          g = el.cloneNode(true);
          g.classList.add('drag-ghost');
          g.style.width = r.width + 'px'; g.style.height = r.height + 'px';
          document.body.appendChild(g);
          el.classList.add('drag-src');
        }
        onStart && onStart(ev);
      }
      if (dragging) {
        ev.preventDefault();
        if (g) { g.style.left = (ev.clientX - ox) + 'px'; g.style.top = (ev.clientY - oy) + 'px'; }
        onMove && onMove(ev, under(ev));
      }
    };
    const under = ev => {
      if (g) g.style.display = 'none';
      const t = document.elementFromPoint(ev.clientX, ev.clientY);
      if (g) g.style.display = '';
      return t;
    };
    const up = ev => {
      if (ev.pointerId !== id) return;
      removeEventListener('pointermove', move); removeEventListener('pointerup', up); removeEventListener('pointercancel', up);
      el.classList.remove('drag-src');
      if (dragging) { const t = ev.type === 'pointercancel' ? null : under(ev); if (g) g.remove(); onDrop && onDrop(ev, t); }
      else if (ev.type !== 'pointercancel') onTap && onTap(ev);
    };
    addEventListener('pointermove', move, { passive: false });
    addEventListener('pointerup', up); addEventListener('pointercancel', up);
  });
}

  render() {

    const [name, ...args] = hash.split('/');
    if (!P() && name !== 'welcome') { location.replace('#/welcome'); return; }
    const route = this.routes[name] || this.routes.home;
    if (this.cleanup) { try { this.cleanup(); } catch (e) { } this.cleanup = null; }
    if (Game.s && !route.game) Game.abort();

};

Router.routes.quest = {
  nav: 'quest',
  render(el) {
    const p = P();
    const cur = p.quest.stage;
    const curSt = questStage(cur);
    const n = QUEST_STEPS.length;
    const chapters = curSt.chapter + 1;
    const diffName = c => (c <= 2 ? 'Easy' : c <= 4 ? 'Medium' : 'Hard');
    const offsets = [0, 70, 105, 70, 0, -70, -105, -70];
    let html = `<div class="page-head"><div class="grow"><h1>Quest Map</h1><p>All games in order · every chapter ends with an exam · it never ends!</p></div>
      <button class="btn sm" data-go="${questRoute(curSt)}">${icon('play')} Continue</button></div>`;
    for (let ch = 1; ch <= chapters; ch++) {
      const doneIn = Math.max(0, Math.min(n, cur - (ch - 1) * n));
      html += `<div class="qchap ${ch > curSt.chapter ? 'locked' : ''}">
        <div class="qc-num">${ch}</div>
        <div class="grow"><b>Chapter ${ch}</b><small>${diffName(ch)} · ${doneIn}/${n} stages · ends with Exam ${ch}</small>
          <div class="qc-bar"><i style="width:${(doneIn / n) * 100}%"></i></div></div>
        ${doneIn === n ? `<span class="qc-done">${icon('check')}</span>` : ch > curSt.chapter ? icon('lock') : ''}
      </div><div class="quest-path">`;
      for (let k = 0; k < n; k++) {
        const idx = (ch - 1) * n + k, st = questStage(idx), m = GAME_META[st.game];
        const state = idx < cur ? 'done' : idx === cur ? 'cur' : 'locked';
        const stars = p.quest.done[idx] || 0;
        if (k > 0) html += `<div class="qdots" style="--x:${(offsets[k] + offsets[k - 1]) / 2}px"><i></i><i></i></div>`;
        html += `<div class="qstop" style="--x:${offsets[k]}px">
          ${state === 'cur' ? `<span class="qbubble">${cur ? 'CONTINUE' : 'START'}</span>` : ''}
          <button class="qnode ${state} ${st.game === 'final' ? 'exam' : ''}" style="--gc:${m.color};--gd:${m.dark}" data-idx="${idx}" aria-label="${m.name}">
            ${icon(state === 'locked' ? 'lock' : st.game === 'final' ? 'trophy' : m.icon)}
          </button>
          <span class="qlabel">${st.game === 'final' ? `Exam ${ch}` : m.name}${state === 'done' ? `<span class="qstars">${icon('star').repeat(stars)}</span>` : ''}</span>
        </div>`;
      }
      html += `</div>`;
    }
    html += `<p class="foot-note">Finish a stage to unlock the next one. Tap a finished stage to practise it again.</p>`;
    el.innerHTML = html;
    $$('.qnode', el).forEach(b => b.onclick = () => {
      const idx = +b.dataset.idx, st = questStage(idx);
      if (idx === cur) { SFX.whoosh(); Router.go(questRoute(st)); }
      else if (idx < cur) { SFX.tap(); Router.go(`play/${st.game}`); }
      else { SFX.wrong(); toast('Finish the stages before this one first!', 'info', 1800); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); }
    });
    setTimeout(() => { const c = $('.qnode.cur', el); if (c) c.scrollIntoView({ behavior: S().motion ? 'smooth' : 'auto', block: 'center' }); }, 350);
  },
};

const LearnState = { cat: 'all', filter: 'all', q: '' };
Router.routes.learn = {
  nav: 'learn',
  render(el) {
    const p = P();
    el.innerHTML = `
      <div class="page-head"><div class="grow"><h1>Vocabulary Center</h1><p>${UNIT.title} · ${VOCAB.length} words · tap a card to flip</p></div>
        <button class="btn sm" data-go="flash/all">${icon('repeat')} Review</button></div>
      <div class="search">${icon('search')}<input type="search" placeholder="Search English or Turkish…" value="${esc(LearnState.q)}"></div>
      <div class="chips" id="cats">
        <button class="chip-btn ${LearnState.cat === 'all' ? 'active' : ''}" data-cat="all">${icon('grid')} All</button>
        ${CATEGORIES.map(c => `<button class="chip-btn ${LearnState.cat === c.id ? 'active' : ''}" style="--cc:${c.color}" data-cat="${c.id}">${icon(c.icon)} ${c.name}</button>`).join('')}
      </div>
      <div class="learn-bar">
        <div class="seg" id="filt">
          <button data-f="all">All</button><button data-f="fav">${icon('heart')} Favorites</button><button data-f="known">${icon('check')} Known</button><button data-f="learning">Learning</button>
        </div>
        <span class="muted small" id="count"></span>
      </div>
      <div class="word-grid" id="grid"></div>`;
    const grid = $('#grid', el);
    const draw = () => {
      const q = LearnState.q.trim().toLowerCase();
      const list = VOCAB.filter(w => {
        if (LearnState.cat !== 'all' && w.cat !== LearnState.cat) return false;
        const ws = p.words[w.id];
        if (LearnState.filter === 'fav' && !(ws && ws.f)) return false;
        if (LearnState.filter === 'known' && !isLearned(ws)) return false;
        if (LearnState.filter === 'learning' && isLearned(ws)) return false;
        if (q && !(w.en.toLowerCase().includes(q) || w.tr.toLowerCase().includes(q))) return false;
        return true;
      });
      $$('#filt button', el).forEach(b => b.classList.toggle('active', b.dataset.f === LearnState.filter));
      $('#count', el).textContent = `${list.length} word${list.length === 1 ? '' : 's'}`;
      if (!list.length) { grid.innerHTML = `<div class="empty" style="grid-column:1/-1">${icon(LearnState.filter === 'fav' ? 'heart' : 'search')}${LearnState.filter === 'fav' ? 'No favorites yet. Tap the heart on words you want to practise.' : 'No words found.'}</div>`; return; }
      grid.innerHTML = list.map((w, i) => {
        const c = CATEGORIES.find(x => x.id === w.cat);
        const ws = p.words[w.id] || {};
        return `<div class="flip" data-id="${w.id}" style="--cc:${c.color};animation-delay:${Math.min(i, 16) * 0.03}s">
          <div class="flip-in">
            <div class="face front">
              ${isLearned(ws) ? `<span class="known-tag">${icon('check')} Known</span>` : ''}
              <span class="f-cat">${esc(c.name)}</span>
              <div class="f-en">${esc(w.en)}</div>
              <div class="f-hint">Do you know the meaning?</div>
              <div class="f-actions">
                ${speakBtn(w.en)}
                <button class="mini-toggle fav ${ws.f ? 'on' : ''}" data-fav title="Add to favorites">${icon('heart')}</button>
                <button class="mini-toggle known ${ws.k ? 'on' : ''}" data-known title="I know this word">${icon('check')}</button>
                <span class="f-tap">${icon('rotate')} Meaning</span>
              </div>
            </div>
            <div class="face back">
              <div class="f-word">${esc(w.en)}</div>
              <span class="f-cat">Türkçe anlamı</span>
              <div class="f-tr">${esc(w.tr)}</div>
              <div class="f-ex">${esc(w.ex)}</div>
              <div class="f-ex-tr">${esc(w.exTr)}</div>
              <div class="f-actions"><span class="f-tap">${icon('rotate')} Back</span></div>
            </div>
          </div>
        </div>`;
      }).join('');
    };
    grid.onclick = e => {
      const card = e.target.closest('.flip'); if (!card) return;
      const id = card.dataset.id, ws = wstat(p, id);
      if (e.target.closest('[data-fav]')) {
        ws.f = !ws.f; e.target.closest('[data-fav]').classList.toggle('on', ws.f); SFX.pop(ws.f ? 4 : 0);
        toast(ws.f ? 'Added to favorites' : 'Removed from favorites', 'info', 1500); DB.save(); return;
      }
      if (e.target.closest('[data-known]')) {
        ws.k = !ws.k; e.target.closest('[data-known]').classList.toggle('on', ws.k);
        if (ws.k) { studyWord(id); SFX.correct(); FX.burst(e.target.closest('[data-known]'), 18); } else SFX.tap();
        DB.save(); checkAchievements(); return;
      }
      if (e.target.closest('[data-say]')) return;
      card.classList.toggle('flipped'); SFX.flip();
      if (card.classList.contains('flipped')) { studyWord(id); DB.save(); }
    };
    $('input', el).oninput = e => { LearnState.q = e.target.value; draw(); };
    $$('[data-cat]', el).forEach(b => b.onclick = () => { LearnState.cat = b.dataset.cat; $$('[data-cat]', el).forEach(x => x.classList.toggle('active', x === b)); SFX.tap(); draw(); });
    $$('#filt button', el).forEach(b => b.onclick = () => { LearnState.filter = b.dataset.f; SFX.tap(); draw(); });
    draw();
  },
};

Router.routes.flash = {
  game: true,
  render(el) {
    const p = P();
    const favs = VOCAB.filter(w => p.words[w.id] && p.words[w.id].f);
    const pool = favs.length >= 5 ? favs : VOCAB.filter(w => !isLearned(p.words[w.id]));
    const deck = pickWords(pool.length >= 5 ? pool : VOCAB, 10, p);
    let i = 0, knew = 0;
    const draw = () => {
      if (i >= deck.length) {
        el.innerHTML = `<div class="g-top"><button class="icon-btn" data-go="learn">${icon('back')}</button><div class="g-title"><b>Review Cards</b><small>Finished</small></div></div>
          <div class="fc-wrap"><div class="trophy-big">${icon('sparkles')}</div><h1>Review complete!</h1><p class="muted" style="font-weight:800">You knew ${knew} of ${deck.length} words.</p>
          <div class="row gap"><button class="btn ghost" data-go="learn">${icon('book')} Vocabulary</button><button class="btn" data-again>${icon('repeat')} Again</button></div></div>`;
        $('[data-again]', el).onclick = () => Router.render();
        FX.confetti({ count: 100 }); SFX.win(); addXP(knew * 3); checkAchievements();
        return;

  },
};

   ENGLISH QUEST — shared game helpers (route, top bar, start screen,
   feedback sheet, multiple-choice renderer)

'use strict';

Router.routes.play = {

function questFor(game, args) {
  if (!args || args[0] !== 'quest') return null;
  const st = questStage(P().quest.stage);
  return st.game === game ? st : null;
}

function questDone(Q, stars = 1) {

  if (Q && p.quest.stage === Q.index) {
    p.quest.done[Q.index] = Math.max(stars, p.quest.done[Q.index] || 0);
    p.quest.stage = Q.index + 1;

  }
  const next = questStage(p.quest.stage);
  return [
    { label: `Continue · ${next.game === 'final' ? 'Exam ' + next.chapter : GAME_META[next.game].name}`, icon: 'next', big: true, onClick: () => Router.go(questRoute(next)) },
    { label: 'Quest map', icon: 'map', ghost: true, onClick: () => Router.go('quest') },
  ];
}

function setScore(el, v) {

/* bottom feedback sheet */
function showSheet({ good, title, body = '', btn = 'Continue', onNext }) {

const GOOD_WORDS = ['Correct!', 'Excellent!', 'Well done!', 'Perfect!', 'Great job!', 'Brilliant!', 'Nice one!'];

/* multiple choice block (quiz, review, final exam, class battle) */
function mcqHTML(q, { chips = true, label = null } = {}) {
  const opts = shuffle(q.options);
  const long = opts.some(o => o.length > 32);
  const qText = esc(q.q).replace(/_{3,}/g, '<span class="blank"></span>');
  return {
    opts,
    html: `<div class="qz-card">
      ${chips ? `<div class="qz-meta"><span class="chip c" style="--cc:var(--gc)">${esc(label || QUESTION_TYPES[q.type] || '')}</span>${TOPICS[q.topic] ? `<span class="chip">${esc(TOPICS[q.topic])}</span>` : ''}</div>` : ''}

  };
}
function bindMCQ(el, opts, answer, onPick) {
  let done = false;
  const pickBtn = b => {
    if (done || b.disabled) return; done = true;
    const picked = opts[+b.dataset.i];
    const ok = picked === answer;
    $$('.opt', el).forEach(x => {
      x.disabled = true;
      const o = opts[+x.dataset.i];
      if (o === answer) x.classList.add('ok');
      else if (x === b) x.classList.add('no');
      else x.classList.add('dim');
    });
    Keys.fn = null;
    onPick(ok, picked, b);
  };
  $$('.opt', el).forEach(b => b.onclick = () => pickBtn(b));
  Keys.fn = e => {
    const k = e.key.toUpperCase();
    const idx = '1234'.indexOf(k) >= 0 ? '1234'.indexOf(k) : 'ABCD'.indexOf(k);
    if (idx >= 0) { const b = $(`.opt[data-i="${idx}"]`, el); if (b) pickBtn(b); }
  };
}
/* distractor meanings for "what does X mean" questions */
function meaningQuestion(w, { reverse = false } = {}) {
  const same = VOCAB.filter(x => x.id !== w.id && x.tr.split(',')[0] !== w.tr.split(',')[0]);
  const others = shuffle(same).slice(0, 3);
  if (reverse) return { q: `Which English word means '${w.tr}'?`, options: [w.en, ...others.map(o => o.en)], answer: w.en };
  return { q: `What does '${w.en}' mean?`, options: [w.tr, ...others.map(o => o.tr)], answer: w.tr };
}
/* fit a size so that items wrap into a box (used by letter games) */
function fitSize(W, H, lengths, { max = 56, min = 18, gapX = 16, gapY = 8, pad = 4 } = {}) {
  for (let bs = max; bs >= min; bs--) {
    let rows = 1, rw = 0;
    for (const len of lengths) {
      const ww = len * (bs + 4) + pad * 2;
      if (rw > 0 && rw + gapX + ww > W) { rows++; rw = ww; } else rw += (rw > 0 ? gapX : 0) + ww;
      if (ww > W) { rows = 999; break; }
    }
    if (rows * (bs + pad * 2 + gapY) <= H) return bs;
  }
  return min;
}

   Drag (or tap) scrambled letters into the slots to build the English word.
   ========================================================================= */
'use strict';

  { min: 4, max: 4, decoys: 0, name: 'Warm-up' },
  { min: 5, max: 5, decoys: 0, name: 'Easy' },
  { min: 6, max: 6, decoys: 0, name: 'Easy+' },
  { min: 7, max: 7, decoys: 0, name: 'Medium' },
  { min: 7, max: 8, decoys: 1, name: 'Medium+' },
  { min: 8, max: 9, decoys: 1, name: 'Hard' },
  { min: 9, max: 10, decoys: 2, name: 'Expert' },
  { min: 10, max: 13, decoys: 2, name: 'Master' },

const WORDS_PER_LEVEL = 5;
const TILE_COLORS = ['#3B82F6', '#6366F1', '#0EA5E9', '#8B5CF6', '#2563EB', '#06B6D4'];

GAMES.connect = function (el, args) {
  const p = P();

  const rec = p.games.connect;

  const levelSelect = () => {
    const unlocked = Math.min(rec.level, CONNECT_LEVELS.length);
    startScreen(el, 'connect', {
      desc: 'Read the Turkish meaning, then drag the letters into the boxes to build the English word.',
      how: ['Drag a letter into a box — or just tap it.', 'Tap a box to send its letter back.', 'Stuck? Use a hint (it costs points).'],
      extra: `<div class="level-grid">${CONNECT_LEVELS.map((L, i) => {
        const n = i + 1, st = rec.stars[n] || 0;
        const cls = n > unlocked ? 'locked' : n === unlocked && !st ? 'cur' : st ? 'done' : '';
        return `<button class="lvl ${cls}" data-lvl="${n}" title="${L.name}">${n > unlocked ? icon('lock') : n}${st ? `<span class="lstars">${icon('star').repeat(st)}</span>` : ''}</button>`;
      }).join('')}</div><p class="muted small" style="font-weight:800">Choose a level · ${WORDS_PER_LEVEL} words each</p>`,
      hideStart: true,
      onBind: e => $$('[data-lvl]', e).forEach(b => b.onclick = () => { SFX.whoosh(); play(+b.dataset.lvl); }),
    });
  };

  const play = level => {
    const L = CONNECT_LEVELS[level - 1];
    let pool = LETTER_WORDS.filter(w => w.key.length >= L.min && w.key.length <= L.max);
    if (pool.length < WORDS_PER_LEVEL) pool = LETTER_WORDS.filter(w => w.key.length >= L.min - 1 && w.key.length <= L.max + 1);
    const words = pickWords(pool, WORDS_PER_LEVEL, p);

      el.innerHTML = gameTop('connect', Q ? questLabel(Q) : `Level ${level} · ${L.name}`, scorePill(s.score)) + `
        <div class="g-body">
          ${stepsHTML(words.length, idx)}
          <div class="wc-area">
            <div class="clue" id="clue"></div>
            <div class="slots" id="slots"></div>
            <div class="tiles" id="tiles"></div>

          <div class="g-tools">

      }
      const k = normalizeKey(e.key);
      if (/^[A-Z]$/.test(k)) { const t = tiles.find(x => x.ch === k && x.slot < 0); if (t) place(t.id); }
    };

    const check = () => {
      const guess = slots.map(x => tiles[x.tile].ch).join('');
      const w = words[idx];
      if (guess === target) return success();
      busy = true; wrongs++;
      const sEl = $('#slots', el);
      $$('.slot', el).forEach(n => { if (!n.classList.contains('locked')) n.classList.add('no'); });
      if (!recorded) {
        recorded = true;
        Game.wrong({ wordId: w.id, el: sEl, mistake: { q: `Word Connect: build the word for "${w.tr}"`, mine: guess, correct: target, exp: `${target} = ${w.tr}. ${w.def ? '(' + w.def + ')' : ''}` } });
      } else { sEl.classList.remove('shake'); void sEl.offsetWidth; sEl.classList.add('shake'); SFX.wrong(); }
      FX.float(sEl, 'Try again!', 'bad');
      setTimeout(() => { slots.forEach((sl, i) => { if (!sl.locked) unplace(i); }); updateSlots(); busy = false; if (wrongs >= 3) toast('Tip: use a Hint or Reveal the word', 'info'); }, 700);
    };

    const hint = () => {
      if (busy) return;
      const i = slots.findIndex((sl, k) => !sl.locked && (sl.tile < 0 || tiles[sl.tile].ch !== target[k]));
      if (i < 0) return;
      if (hints >= target.length - 1) { toast('No more hints for this word', 'info'); return; }
      if (slots[i].tile >= 0) unplace(i);
      let t = tiles.find(x => x.ch === target[i] && x.slot < 0);
      if (!t) {
        const si = slots.findIndex((sl, k) => !sl.locked && sl.tile >= 0 && tiles[sl.tile].ch === target[i]);
        if (si >= 0) { const tid = slots[si].tile; unplace(si); t = tiles[tid]; }
      }
      if (!t) return;
      slots[i].tile = t.id; t.slot = i; slots[i].locked = true;
      hints++; totalHints++;
      s.score = Math.max(0, s.score - 30); setScore(el, s.score);
      FX.float($(`.slot[data-i="${i}"]`, el), '-30', 'bad');
      SFX.coin(); updateSlots();
      if (slots.every(x => x.tile >= 0)) setTimeout(check, 250);
    };

    const success = () => {
      busy = true;
      const w = words[idx];
      $$('.slot', el).forEach(n => n.classList.add('ok'));
      const pts = Math.max(30, 100 + target.length * 10 - hints * 30 - wrongs * 20);
      if (wrongs === 0 || !recorded) Game.correct({ wordId: w.id, points: pts, el: $('#slots', el) });
      else { s.score += Math.round(pts / 2); FX.float($('#slots', el), `+${Math.round(pts / 2)}`); SFX.correct(); }
      solvedCount++;
      dailyEvent('connectWord', 1);
      setScore(el, s.score);
      FX.burst($('#slots', el), 40);
      setTimeout(() => showSheet({ good: true, title: pick(GOOD_WORDS), body: wordCardHTML(w), btn: idx + 1 < words.length ? 'Next word' : 'See results', onNext: next }), 700);
    };
    const reveal = () => {
      if (busy) return;
      busy = true;
      const w = words[idx];
      if (!recorded) { recorded = true; Game.wrong({ wordId: w.id, mistake: { q: `Word Connect: build the word for "${w.tr}"`, mine: '(revealed)', correct: target, exp: `${target} = ${w.tr}.` } }); }
      slots.forEach((sl, i) => { if (!sl.locked) unplace(i); });
      slots.forEach((sl, i) => { const t = tiles.find(x => x.ch === target[i] && x.slot < 0); if (t) { sl.tile = t.id; t.slot = i; sl.locked = true; } });
      updateSlots();
      setTimeout(() => showSheet({ good: false, title: 'The word was ' + target, body: wordCardHTML(w), btn: idx + 1 < words.length ? 'Next word' : 'See results', onNext: next }), 500);
    };
    const next = () => {
      idx++;
      if (idx < words.length) loadWord(); else finish();
    };
    const finish = () => {
      Keys.fn = null;
      const stars = solvedCount === words.length ? (totalHints === 0 && s.wrong === 0 ? 3 : 2) : solvedCount >= 3 ? 1 : 0;
      if (stars > (rec.stars[level] || 0)) rec.stars[level] = stars;
      const unlockedNew = solvedCount >= 3 && rec.level <= level && level < CONNECT_LEVELS.length;
      if (unlockedNew) rec.level = level + 1;
      const r = Game.finish();
      let actions = [];
      if (Q) actions = questDone(Q, stars);
      else {
        // continuous play: the next level starts right away (or the same level again)
        const nextLvl = solvedCount >= 3 && level < CONNECT_LEVELS.length ? level + 1 : level;
        actions.push({ label: nextLvl > level ? `Continue · Level ${nextLvl}` : 'Try again', icon: 'next', big: true, onClick: () => play(nextLvl) });
        actions.push({ label: 'Levels', icon: 'grid', ghost: true, onClick: levelSelect });
      }
      showResults(el, r, {
        stars, subtitle: `Level ${level} complete · ${solvedCount}/${words.length} words`,
        extraHTML: unlockedNew ? `<div class="tip">${icon('sparkles')}<span>Level ${level + 1} unlocked! Longer words are waiting.</span></div>` : '',
        actions,
      });
    };

    loadWord();
    const onResize = () => { if ($('.wc-area', el)) sizeUp(); };
    addEventListener('resize', onResize);
    cleanup = () => removeEventListener('resize', onResize);
  };

  let cleanup = null;
  if (Q) play(Q.connectLevel); else levelSelect();
  return () => cleanup && cleanup();
};

/* =========================================================================
   GAME 2 — WORD MATCH · English ↔ Turkish
   Drag an English card onto its Turkish meaning, or tap one then the other.
   ========================================================================= */
'use strict';
GAMES.match = function (el, args) {
  const p = P();
  const Q = questFor('match', args);
  let timer = 0;
  const ROUNDS = 3;
  const ROUND_TIME = 50;

  const menu = () => {
    clearInterval(timer);
    let mode = S().matchMode || 'timed';
    startScreen(el, 'match', {
      desc: 'Match each English word with its Turkish meaning. Correct pairs turn green!',
      how: ['Drag an English card onto the Turkish card…', '…or tap one card, then tap its partner.', 'Tap the speaker to hear the word.'],
      extra: `<div class="mode-row">
        <button class="mode-card" data-mode="timed">${icon('clock')}<b>Timed</b><small>${ROUND_TIME}s per round · time bonus</small></button>
        <button class="mode-card" data-mode="relaxed">${icon('heart')}<b>Relaxed</b><small>No timer · take your time</small></button>
      </div>`,
      btn: 'Start matching',
      onBind: e => {
        const upd = () => $$('[data-mode]', e).forEach(b => b.classList.toggle('sel', b.dataset.mode === mode));
        $$('[data-mode]', e).forEach(b => b.onclick = () => { mode = b.dataset.mode; S().matchMode = mode; DB.save(); SFX.tap(); upd(); });
        upd();
      },
      onStart: () => play(S().matchMode || 'timed'),
    });
  };

  const play = mode => {
    const timed = mode === 'timed';
    const perRound = innerHeight < 640 ? 5 : 6;
    const norm = w => w.tr.split(',')[0].replace(/[()’']/g, '').trim().toLowerCase();
    const candidates = VOCAB.filter(w => w.en.length <= 28 && w.tr.length <= 30);
    const chosen = pickWords(candidates, candidates.length, p);
    // build rounds with no two similar Turkish meanings in the same round
    const rounds = [];
    const used = new Set();
    for (let r = 0; r < ROUNDS; r++) {
      const round = [], trs = new Set();
      for (const w of chosen) {
        if (round.length >= perRound) break;
        if (used.has(w.id) || trs.has(norm(w))) continue;
        round.push(w); trs.add(norm(w)); used.add(w.id);
      }
      rounds.push(round);
    }
    const s = Game.start('match', { mode });
    let ri = 0, left = ROUND_TIME, sel = null, matched = 0, roundMistake = {};

    const drawRound = () => {
      const words = rounds[ri];
      matched = 0; sel = null; roundMistake = {}; left = ROUND_TIME;
      const ens = shuffle(words), trs = shuffle(words);
      el.innerHTML = gameTop('match', `${Q ? `Chapter ${Q.chapter} · ` : ''}Round ${ri + 1} of ${ROUNDS} · ${timed ? 'Timed' : 'Relaxed'}`, scorePill(s.score)) + `
        <div class="g-body">
          ${timed ? `<div class="mt-timer" id="tm"><span class="ic-wrap">${icon('clock')}</span><div class="g-progress"><i style="width:100%"></i></div><b id="tml">${left}s</b></div>` : `<div style="margin:.2rem 0 .5rem">${stepsHTML(ROUNDS, ri)}</div>`}
          <div class="match-board">
            <div class="match-col"><h4>English</h4>${ens.map((w, i) => `<div class="mcard en" data-side="en" data-id="${w.id}" style="--i:${i}">${speakBtn(w.en, 'sm')}<span>${esc(w.en)}</span></div>`).join('')}</div>
            <div class="match-col"><h4>Türkçe</h4>${trs.map((w, i) => `<div class="mcard tr" data-side="tr" data-id="${w.id}" style="--i:${i + 0.5}"><span>${esc(w.tr)}</span></div>`).join('')}</div>
          </div>
        </div>`;
      bindBack(el, { ask: true });
      $$('.mcard', el).forEach(card => {
        makeDraggable(card, {
          onStart: () => select(card, true),
          onMove: (ev, under) => {
            $$('.mcard.hover', el).forEach(x => x.classList.remove('hover'));
            const t = under && under.closest('.mcard');
            if (t && t.dataset.side !== card.dataset.side && !t.classList.contains('ok')) t.classList.add('hover');
          },
          onDrop: (ev, under) => {
            $$('.mcard.hover', el).forEach(x => x.classList.remove('hover'));
            const t = under && under.closest('.mcard');
            if (t && t.dataset.side !== card.dataset.side && !t.classList.contains('ok')) attempt(card, t);
          },
          onTap: ev => { if (ev.target.closest && ev.target.closest('[data-say]')) return; tap(card); },
        });
      });
      if (timed) {
        clearInterval(timer);
        timer = setInterval(() => {
          left--;
          const tm = $('#tm', el); if (!tm) return clearInterval(timer);
          $('i', tm).style.width = (left / ROUND_TIME) * 100 + '%';
          $('#tml', el).textContent = left + 's';
          tm.classList.toggle('low', left <= 10);
          if (left <= 5 && left > 0) SFX.tick();
          if (left <= 0) { clearInterval(timer); timeUp(); }
        }, 1000);
      }
    };
    const select = (card, keep) => {
      if (card.classList.contains('ok')) return;
      if (sel && sel !== card && sel.dataset.side === card.dataset.side) sel.classList.remove('sel');
      sel = card; card.classList.add('sel'); if (!keep) SFX.tap();
    };
    const tap = card => {
      if (card.classList.contains('ok')) return;
      if (!sel || sel === card) { if (sel === card) { card.classList.remove('sel'); sel = null; return; } select(card); return; }
      if (sel.dataset.side === card.dataset.side) { select(card); return; }
      attempt(sel, card);
    };
    const attempt = (a, b) => {
      const en = a.dataset.side === 'en' ? a : b, tr = a.dataset.side === 'en' ? b : a;
      $$('.mcard.sel', el).forEach(x => x.classList.remove('sel'));
      sel = null;
      const w = VOCAB_BY_ID[en.dataset.id];
      if (en.dataset.id === tr.dataset.id) {
        en.classList.add('ok'); tr.classList.add('ok');
        Game.correct({ wordId: w.id, points: 50, el: tr });
        p.stats.pairs++; dailyEvent('pair', 1);
        setScore(el, s.score);
        setTimeout(() => { en.classList.add('gone'); tr.classList.add('gone'); }, 700);
        matched++;
        if (matched === rounds[ri].length) roundDone(false);
      } else {
        const picked = VOCAB_BY_ID[tr.dataset.id];
        en.classList.add('no'); tr.classList.add('no');
        Game.wrong({
          wordId: w.id, el: en, penalty: 10,
          mistake: roundMistake[w.id] ? null : { q: `Word Match: "${w.en}"`, mine: picked.tr, correct: w.tr, exp: `'${w.en}' means '${w.tr}'. '${picked.tr}' is '${picked.en}'.` },
        });
        roundMistake[w.id] = true;
        tr.classList.add('shake');
        setScore(el, s.score);
        setTimeout(() => { en.classList.remove('no', 'shake'); tr.classList.remove('no', 'shake'); }, 650);
      }
    };
    const timeUp = () => {
      toast("Time's up!", 'bad');
      SFX.wrong();
      $$('.mcard:not(.ok)', el).forEach(c => c.classList.add('no'));
      roundDone(true);
    };
    const roundDone = timeout => {
      clearInterval(timer);
      if (timed && !timeout && left > 0) {
        const bonus = left * 5;
        s.score += bonus;
        setTimeout(() => { FX.float($('.match-board', el), `Time bonus +${bonus}`, 'gold'); setScore(el, s.score); SFX.coin(); }, 300);
        if (left >= 20) p.stats.speedMatch = 1;
      }
      if (!timeout) FX.burst($('.match-board', el), 50);
      setTimeout(() => { ri++; if (ri < ROUNDS) drawRound(); else finish(); }, timeout ? 1400 : 1300);
    };
    const finish = () => {
      clearInterval(timer);
      const r = Game.finish();
      showResults(el, r, {
        subtitle: `${timed ? 'Timed' : 'Relaxed'} mode · ${r.correct} pairs matched`,
        actions: Q ? questDone(Q, r.accuracy >= 90 ? 3 : r.accuracy >= 65 ? 2 : 1) : [
          { label: 'Continue · New words', icon: 'next', big: true, onClick: () => play(mode) },
          { label: 'Change mode', icon: 'settings', ghost: true, onClick: menu },
        ],
      });
    };
    drawRound();
  };

  if (Q) play(Q.matchMode); else menu();
  return () => clearInterval(timer);
};

  <script>/* js/games/wordle.js */
/* =========================================================================
   GAME 3 — WORDLE · Guess the Hidden Word
   GREEN = right letter, right place · ORANGE = in the word, wrong place ·
   GRAY = not in the word. Duplicate letters are evaluated correctly.
   ========================================================================= */
'use strict';
/* two-pass evaluation so repeated letters are coloured correctly */
function wordleEvaluate(guess, target) {
  const n = target.length, res = Array(n).fill('x'), left = {};
  for (let i = 0; i < n; i++) {
    if (guess[i] === target[i]) res[i] = 'g';
    else left[target[i]] = (left[target[i]] || 0) + 1;
  }
  for (let i = 0; i < n; i++) {
    if (res[i] === 'g') continue;
    if (left[guess[i]] > 0) { res[i] = 'o'; left[guess[i]]--; }
  }
  return res;
}

GAMES.wordle = function (el, args) {
  const p = P();
  const Q = questFor('wordle', args);
  const MAX_TRIES = 5, WORDS = 3;
  const BANDS = {
    easy: { min: 4, max: 5, label: 'Easy', sub: '4–5 letters' },
    medium: { min: 6, max: 7, label: 'Medium', sub: '6–7 letters' },
    hard: { min: 8, max: 9, label: 'Hard', sub: '8–9 letters' },
  };
  let resizeFn = null;

  const menu = () => {
    let band = 'easy';
    startScreen(el, 'wordle', {
      desc: 'The Turkish meaning is your clue. Guess the English word in 5 tries!',
      extra: `<div class="wd-legend" style="font-size:.85rem">
          <span><i style="background:var(--green)"></i>Correct place</span>
          <span><i style="background:#F59E0B"></i>Wrong place</span>
          <span><i style="background:var(--gray-tile)"></i>Not in word</span></div>
        <div class="mode-row">${Object.entries(BANDS).map(([k, b]) => `<button class="mode-card" data-band="${k}">${icon(k === 'easy' ? 'star' : k === 'medium' ? 'zap' : 'flame')}<b>${b.label}</b><small>${b.sub}</small></button>`).join('')}</div>`,
      btn: `Play ${WORDS} words`,
      onBind: e => {
        const upd = () => $$('[data-band]', e).forEach(b => b.classList.toggle('sel', b.dataset.band === band));
        $$('[data-band]', e).forEach(b => b.onclick = () => { band = b.dataset.band; SFX.tap(); upd(); });
        upd();
      },
      onStart: () => play(band),
    });
  };

  const play = bandKey => {
    const B = BANDS[bandKey];
    const words = pickWords(LETTER_WORDS.filter(w => w.key.length >= B.min && w.key.length <= B.max), WORDS, p);
    const s = Game.start('wordle', { band: bandKey });
    let wi = 0, solved = 0;
    let target, w, guesses, cur, locked, keyState, hintLevel;

    const load = () => {
      w = words[wi]; target = w.key; guesses = []; cur = ''; locked = false; keyState = {}; hintLevel = 0;
      const n = target.length;
      const cat = CATEGORIES.find(c => c.id === w.cat);
      el.innerHTML = gameTop('wordle', `${Q ? `Chapter ${Q.chapter} · ` : ''}${B.label} · Word ${wi + 1} of ${words.length}`, scorePill(s.score)) + `
        <div class="g-body">
          <div class="clue">
            <div class="c-lbl">Turkish meaning</div>
            <div class="c-main">${esc(w.tr)}</div>
            <div class="c-sub"><span class="tries" id="tries"></span> · ${n} letters · ${esc(cat ? cat.name : '')}</div>
            <div id="hintbox"></div>
          </div>
          <div class="wd-board" id="board"><div class="wd-grid" id="grid">${[...Array(MAX_TRIES)].map((_, r) => `<div class="wd-row" data-r="${r}" style="--n:${n}">${[...Array(n)].map((_, c) => `<div class="wd-tile" style="--i:${c}"></div>`).join('')}</div>`).join('')}</div></div>
          <div class="g-tools" style="padding:.1rem 0 .5rem"><button class="tool-btn hint" data-hint>${icon('bulb')}Hint<small>-30</small></button></div>
          <div class="kb" id="kb">${['QWERTYUIOP', 'ASDFGHJKL', '>ZXCVBNM<'].map(row => `<div class="kb-row">${row.split('').map(k => k === '>' ? `<button class="key wide" data-k="ENTER">ENTER</button>` : k === '<' ? `<button class="key wide" data-k="BACK" aria-label="Delete">${icon('backspace')}</button>` : `<button class="key" data-k="${k}">${k}</button>`).join('')}</div>`).join('')}</div>
        </div>`;
      bindBack(el, { ask: true });
      $$('.key', el).forEach(k => k.onclick = () => press(k.dataset.k));
      $('[data-hint]', el).onclick = hint;
      Keys.fn = e => {
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        if (e.key === 'Enter') { e.preventDefault(); press('ENTER'); }
        else if (e.key === 'Backspace') press('BACK');
        else { const k = normalizeKey(e.key); if (/^[A-Z]$/.test(k)) press(k); }
      };
      updateTries(); size(); paintRow();
    };
    const size = () => {
      const board = $('#board', el); if (!board) return;
      const n = target.length, gap = 8;
      const W = board.clientWidth - 4, H = board.clientHeight - 22;
      const ts = Math.max(26, Math.min(70, Math.floor((W - (n - 1) * gap) / n), Math.floor((H - (MAX_TRIES - 1) * gap) / MAX_TRIES)));
      board.style.setProperty('--ts', ts + 'px');
    };
    resizeFn = size;
    const updateTries = () => {
      const left = MAX_TRIES - guesses.length;
      $('#tries', el).innerHTML = `${[...Array(MAX_TRIES)].map((_, i) => `<i class="${i < left ? '' : 'off'}"></i>`).join('')} ${left} ${left === 1 ? 'try' : 'tries'} left`;
    };
    const rowEl = r => $(`.wd-row[data-r="${r}"]`, el);
    const paintRow = () => {
      const r = guesses.length; if (r >= MAX_TRIES) return;
      $$('.wd-row', el).forEach((x, i) => x.classList.toggle('current', i === r));
      $$('.wd-tile', rowEl(r)).forEach((t, i) => { t.textContent = cur[i] || ''; t.classList.toggle('filled', !!cur[i]); });
    };
    const press = k => {
      if (locked) return;
      if (k === 'ENTER') return submit();
      if (k === 'BACK') { cur = cur.slice(0, -1); SFX.tap(); return paintRow(); }
      if (cur.length < target.length) { cur += k; SFX.pop(cur.length % 8); paintRow(); }
    };
    const submit = () => {
      const row = rowEl(guesses.length);
      if (cur.length < target.length) {
        row.classList.remove('shake'); void row.offsetWidth; row.classList.add('shake');
        toast(`Not enough letters — the word has ${target.length}`, 'info', 1600); SFX.wrong(); return;
      }
      locked = true;
      const res = wordleEvaluate(cur, target);
      const guess = cur;
      guesses.push(guess);
      $$('.wd-tile', row).forEach((t, i) => { t.classList.add(res[i], 'rev'); });
      const n = target.length, dur = 230 * (n - 1) + 620;
      $$('.wd-tile', row).forEach((t, i) => setTimeout(() => SFX.flip(), i * 230 + 300));
      setTimeout(() => {
        $$('.wd-tile', row).forEach(t => { t.classList.remove('rev'); t.classList.add('done'); });
        const rank = { x: 1, o: 2, g: 3 };
        guess.split('').forEach((ch, i) => { if (!keyState[ch] || rank[res[i]] > rank[keyState[ch]]) keyState[ch] = res[i]; });
        $$('.key', el).forEach(k => { const st = keyState[k.dataset.k]; k.classList.remove('g', 'o', 'x'); if (st) k.classList.add(st); });
        updateTries();
        if (guess === target) return win(row);
        if (guesses.length >= MAX_TRIES) return lose();
        cur = ''; locked = false; paintRow();
        const left = MAX_TRIES - guesses.length;
        if (left <= 2) toast(`${left} ${left === 1 ? 'try' : 'tries'} left!`, 'info', 1400);
      }, dur);
    };
    const win = row => {
      row.classList.add('win');
      const tries = guesses.length;
      const pts = Math.max(40, 100 + target.length * 10 + (MAX_TRIES - tries) * 40 - hintLevel * 30);
      Game.correct({ wordId: w.id, points: pts, el: row });
      solved++; p.stats.wordles++; p.stats.wordleBest = Math.min(p.stats.wordleBest, tries);
      dailyEvent('wordleSolved', 1);
      setScore(el, s.score);
      FX.burst(row, 60);
      setTimeout(() => showSheet({ good: true, title: tries === 1 ? 'Genius! First try!' : `${pick(GOOD_WORDS)} ${tries} ${tries === 1 ? 'try' : 'tries'}`, body: wordCardHTML(w), btn: wi + 1 < words.length ? 'Next word' : 'See results', onNext: next }), 900);
    };
    const lose = () => {
      Game.wrong({ wordId: w.id, mistake: { q: `Wordle: find the word for "${w.tr}"`, mine: guesses[guesses.length - 1], correct: target, exp: `${target} = ${w.tr}. ${w.def ? 'Definition: ' + w.def + '.' : ''}` } });
      setTimeout(() => showSheet({ good: false, title: `The word was ${target}`, body: `<div class="exp">${esc(w.def ? 'Definition: ' + w.def : '')}</div>` + wordCardHTML(w), btn: wi + 1 < words.length ? 'Next word' : 'See results', onNext: next }), 500);
    };
    const hint = () => {
      if (locked) return;
      const box = $('#hintbox', el);
      if (hintLevel === 0) {
        hintLevel = 1;
        box.innerHTML = `<div class="c-hint">${icon('bulb')} <b>English hint:</b> ${esc(w.def || w.ex.replace(new RegExp(w.key, 'ig'), '____'))}</div>`;
      } else if (hintLevel === 1) {
        hintLevel = 2;
        box.innerHTML += `<div class="c-hint">${icon('bulb')} The word starts with <b>${target[0]}</b> and ends with <b>${target[target.length - 1]}</b>.</div>`;
        $('[data-hint]', el).disabled = true;
      }
      s.score = Math.max(0, s.score - 30); setScore(el, s.score); SFX.coin();
      setTimeout(size, 50);
    };
    const next = () => { wi++; if (wi < words.length) load(); else finish(); };
    const finish = () => {
      Keys.fn = null;
      const r = Game.finish();

/* =========================================================================

function pickQuestions(n, pool = QUIZ, p = P()) {
  const recent = new Set(p.recentQ || []);
  const fresh = pool.filter(q => !recent.has(q.id));
  const base = fresh.length >= n ? fresh : pool;
  const picked = weightedSample(base, n, q => {
    const t = p.topics[q.topic];
    const weak = t ? (t.w + 0.5) / (t.c + t.w + 1) : 0.4;
    const ws = q.wordId && p.words[q.wordId];
    return 1 + weak * 2.5 + (ws ? ws.w * 0.6 : 0);
  });
  // spread question types so the same type is not shown back-to-back
  const out = [];
  const rest = picked.slice();
  while (rest.length) {
    const last = out[out.length - 1];
    const i = rest.findIndex(q => !last || q.type !== last.type);
    out.push(rest.splice(i < 0 ? 0 : i, 1)[0]);
  }
  return out;

    ${strong.length ? `<div><h4>${icon('check')} Strong Topics</h4><div class="tags">${strong.map(t => `<span class="chip tag-strong">${esc(t)}</span>`).join('')}</div></div>` : ''}

/* =========================================================================
   GAME 5 — SENTENCE BUILDER · Build Correct English Sentences
   Drag word chips into order (or tap them). Wrong order → hint about where
   the mistake starts. Turkish translation + spoken English sentence.
   ========================================================================= */
'use strict';
function tokenizeSentence(en) {
  let text = en.trim(), end = '';
  const m = text.match(/[.!?]$/);
  if (m) { end = m[0]; text = text.slice(0, -1); }
  const words = text.split(/\s+/);
  return {
    end,
    tokens: words.map((w, i) => {
      let shown = w;
      if (i === 0) {
        const bare = w.replace(/[^A-Za-zÀ-ž.']/g, '');
        if (!PROPER_WORDS.has(bare) && !PROPER_WORDS.has(w)) shown = w.charAt(0).toLowerCase() + w.slice(1);
      }
      return { id: i, text: shown, key: w.toLowerCase() };
    }),
  };
}

GAMES.sentence = function (el, args) {

    const load = () => {

          <div class="sb-area">

      render();

      const n = letters.length;
      ls = ws * (n <= 4 ? 0.27 : n <= 5 ? 0.25 : n <= 6 ? 0.23 : n <= 7 ? 0.21 : n <= 8 ? 0.195 : 0.178);
      const R = ws / 2 - ls / 2 - ws * 0.045;
      wheel.style.setProperty('--ws', ws + 'px'); wheel.style.setProperty('--ls', ls + 'px');
      pts = letters.map((_, i) => { const a = -Math.PI / 2 + (i * 2 * Math.PI) / n; return { x: ws / 2 + R * Math.cos(a), y: ws / 2 + R * Math.sin(a) }; });
      let nodes = $$('.wl', wheel);
      if (nodes.length !== n) {
        nodes.forEach(x => x.remove());
        letters.forEach((ch, i) => { const d = document.createElement('div'); d.className = 'wl'; d.dataset.i = i; d.textContent = ch; wheel.appendChild(d); });
        nodes = $$('.wl', wheel);
      }
      nodes.forEach((d, i) => { d.textContent = letters[i]; d.style.left = pts[i].x + 'px'; d.style.top = pts[i].y + 'px'; });
      sizeWords();
    };
    const sizeWords = () => {
      const box = $('#words', el);
      const body = $('.g-body', el);
      const barH = $('.ci-bar', el).offsetHeight || 56;
      const wide = isWide();
      const W = (wide ? body.clientWidth - ws - 48 : body.clientWidth) - 12;
      const H = (wide ? body.clientHeight : body.clientHeight - ws - barH - 20) - 12;
      const bs = fitSize(W, H, targets.map(t => t.length + (t === L.main ? 0.6 : 0)), { max: 52, min: 18, gapX: 18, gapY: 9, pad: 3 });
      box.style.setProperty('--bs', bs + 'px'); box.style.setProperty('--bsb', bs + 'px');
    };

    const hit = (e, factor = 0.5) => {
      const r = wheel.getBoundingClientRect();
      const x = e.clientX - r.left, y = e.clientY - r.top;
      for (let i = 0; i < pts.length; i++) if (Math.hypot(pts[i].x - x, pts[i].y - y) < ls * factor) return i;
      return -1;
    };
    const drawLine = e => {
      if (!path.length) { line.setAttribute('d', ''); return; }
      let d = path.map((i, k) => `${k ? 'L' : 'M'}${pts[i].x.toFixed(1)} ${pts[i].y.toFixed(1)}`).join(' ');
      if (e && dragging) { const r = wheel.getBoundingClientRect(); d += ` L${(e.clientX - r.left).toFixed(1)} ${(e.clientY - r.top).toFixed(1)}`; }
      line.setAttribute('d', d);
    };
    const mark = () => {
      $$('.wl', wheel).forEach((d, i) => d.classList.toggle('on', path.includes(i)));
      prev.className = 'ci-preview';
      prev.innerHTML = path.map(i => `<span>${letters[i]}</span>`).join('');
    };
    wheel.addEventListener('pointerdown', e => {
      const i = hit(e, 0.62); if (i < 0) return;
      e.preventDefault();
      try { wheel.setPointerCapture(e.pointerId); } catch (_) { }
      dragging = true; path = [i]; SFX.pop(0); mark(); drawLine(e);
    });
    wheel.addEventListener('pointermove', e => {
      if (!dragging) return;
      e.preventDefault();
      const i = hit(e, 0.44);
      if (i >= 0) {
        if (path.length > 1 && i === path[path.length - 2]) { path.pop(); SFX.tap(); mark(); }
        else if (!path.includes(i)) { path.push(i); SFX.pop(path.length - 1); buzz(8); mark(); }
      }
      drawLine(e);
    });
    const end = () => {
      if (!dragging) return;
      dragging = false;
      const word = path.map(i => letters[i]).join('');
      path = []; drawLine(); $$('.wl', wheel).forEach(d => d.classList.remove('on'));
      evaluate(word);
    };
    wheel.addEventListener('pointerup', end);
    wheel.addEventListener('pointercancel', end);
    wheel.addEventListener('lostpointercapture', end);

    const flashPreview = (cls, word) => {
      prev.className = 'ci-preview ' + cls;
      prev.innerHTML = word.split('').map(ch => `<span>${ch}</span>`).join('');
      clearTimeout(flashPreview.t);
      flashPreview.t = setTimeout(() => { prev.className = 'ci-preview'; prev.innerHTML = ''; }, 750);
    };
    const showFound = (t, bonus = false) => {
      $$('.found-toast', el).forEach(n => n.remove());
      const inf = info[t];
      const d = document.createElement('div');
      d.className = 'found-toast';
      d.innerHTML = `<b>${t}</b><span>${esc((bonus ? 'Bonus! ' : '') + inf.tr)}</span>${speakBtn(inf.vocab ? inf.vocab.en : t.toLowerCase(), 'sm')}`;
      $('.g-body', el).appendChild(d);
      setTimeout(() => { d.classList.add('out'); setTimeout(() => d.remove(), 300); }, 2300);
    };
    const evaluate = word => {
      if (word.length < 2) { prev.innerHTML = ''; return; }
      const row = $(`.ci-word[data-w="${word}"]`, el);
      if (targets.includes(word)) {
        if (found.has(word)) { flashPreview('dup', word); row.classList.remove('flash'); void row.offsetWidth; row.classList.add('flash'); toast('Already found!', 'info', 1100); SFX.tap(); return; }
        found.add(word);
        row.classList.add('found');
        $$('.ci-box', row).forEach(b => b.classList.remove('hint'));
        flashPreview('good', word);
        const inf = info[word];
        const bonusMain = word === L.main ? 60 : 0;
        Game.correct({ wordId: inf.vocab ? inf.vocab.id : null, points: word.length * 20 + bonusMain, el: row });
        p.stats.circleWords++; dailyEvent('circleWord', 1);
        setScore(el, s.score);
        FX.burst(row, 26);
        showFound(word);
        $('#fcount', el).textContent = `${found.size}/${targets.length}`;
        if (found.size === targets.length) setTimeout(finish, 1300);
        return;
      }
      if (L.bonus.includes(word)) {
        if (bonusFound.has(word)) { flashPreview('dup', word); toast('Bonus word already found', 'info', 1100); return; }
        bonusFound.add(word);
        s.score += 15; setScore(el, s.score);
        flashPreview('good', word); SFX.coin();
        FX.float(prev, '+15 Bonus', 'gold');
        $('#bcount', el).textContent = bonusFound.size;
        showFound(word, true);
        return;
      }
      flashPreview('bad', word); SFX.wrong(); buzz([20, 30, 20]);
    };

    $('[data-shuffle]', el).onclick = () => {
      SFX.whoosh();
      const order = shuffle(letters.map((_, i) => i));
      letters = order.map(i => letters[i]);
      wheel.animate([{ transform: 'rotate(0)' }, { transform: 'rotate(200deg) scale(.92)' }, { transform: 'rotate(360deg)' }], { duration: 550, easing: 'cubic-bezier(.2,.8,.2,1)' });
      setTimeout(() => layoutWheel(), 120);
    };
    $('[data-hint]', el).onclick = () => {
      const t = targets.find(x => !found.has(x) && revealed[x].size < x.length - 1) || targets.find(x => !found.has(x));
      if (!t) return;
      const row = $(`.ci-word[data-w="${t}"]`, el);
      const boxes = $$('.ci-box', row);
      const k = [...Array(t.length).keys()].find(i => !revealed[t].has(i));
      if (k === undefined) return;
      revealed[t].add(k);
      boxes[k].classList.add('hint');
      boxes[k].animate([{ transform: 'scale(.4)' }, { transform: 'scale(1.2)' }, { transform: 'scale(1)' }], { duration: 450, easing: 'cubic-bezier(.34,1.56,.64,1)' });
      hintsUsed++;
      s.score = Math.max(0, s.score - 25); setScore(el, s.score);
      FX.float(boxes[k], '-25', 'bad'); SFX.coin();
    };
    const bonusBtn = $('[data-bonus]', el);
    if (bonusBtn) bonusBtn.onclick = () => {
      modal(`<h3 style="margin-bottom:.6rem">${icon('sparkles')} Bonus words</h3>
        <p class="muted small" style="margin-bottom:1rem;font-weight:800">Other Unit 1 words hidden in these letters (+15 each).</p>
        <div class="tags" style="display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center">${bonusFound.size ? [...bonusFound].map(b => `<span class="chip c" style="--cc:#8B5CF6">${b} · ${esc(info[b].tr)}</span>`).join('') : '<span class="muted">None yet — keep swiping!</span>'}</div>
        <p class="muted small" style="margin-top:1rem">${bonusFound.size} of ${L.bonus.length} found</p>
        <button class="btn block" style="margin-top:1rem" data-close>OK</button>`, { cls: 'center' });
    };
    $('.g-title', el).style.cursor = 'pointer';
    $('.g-title', el).onclick = () => wordList();
    $('#words', el).onclick = e => { const row = e.target.closest('.ci-word.found'); if (row) wordInfo(row.dataset.w); };
    const wordInfo = t => modal(wordCardHTML(info[t].vocab) + `<button class="btn block" style="margin-top:1rem" data-close>OK</button>`);
    const wordList = () => {
      modal(`<h3 style="margin-bottom:.8rem">Found words</h3>
        <div style="display:grid;gap:.5rem">${targets.map(t => found.has(t)
          ? `<div class="exp" style="display:flex;align-items:center;gap:.6rem">${speakBtn(t.toLowerCase(), 'sm')}<span><b>${t}</b> — ${esc(info[t].tr)}<br><span class="muted small">${esc(info[t].ex)}</span></span></div>`
          : `<div class="exp" style="opacity:.6"><b>${'•'.repeat(t.length)}</b> <span class="muted small">(${t.length} letters)</span></div>`).join('')}</div>
        <button class="btn block" style="margin-top:1rem" data-close>OK</button>`);
    };

    const finish = () => {
      const stars = hintsUsed === 0 ? 3 : hintsUsed <= 2 ? 2 : 1;
      if (stars > (rec.stars[level] || 0)) rec.stars[level] = stars;
      if (!p.circleDone.includes(level)) { p.circleDone.push(level); p.stats.circleLevels = p.circleDone.length; }
      const newUnlock = rec.level <= level && level < CIRCLE_LEVELS.length;
      if (newUnlock) rec.level = level + 1;
      const r = Game.finish({ bonusXP: bonusFound.size * 2 });
      const nextLvl = level < CIRCLE_LEVELS.length ? level + 1 : 1;
      showResults(el, r, {
        stars, subtitle: `Level ${level} complete${bonusFound.size ? ` · ${bonusFound.size} bonus word${bonusFound.size === 1 ? '' : 's'}` : ''}`,
        extraHTML: `<div style="display:grid;gap:.6rem">${targets.map(t => wordCardHTML(info[t].vocab)).join('')}</div>` + (newUnlock && !Q ? `<div class="tip">${icon('sparkles')}<span>Level ${level + 1} unlocked!</span></div>` : ''),
        actions: Q ? questDone(Q, stars) : [
          { label: `Continue · Level ${nextLvl}`, icon: 'next', big: true, onClick: () => play(nextLvl) },
          { label: 'Levels', icon: 'grid', ghost: true, onClick: levelSelect },
        ],
      });
    };

    layoutWheel();
    setTimeout(() => { if ($('#wheel', el)) layoutWheel(); }, 60);
    const onResize = () => { if ($('#wheel', el)) layoutWheel(); };
    addEventListener('resize', onResize);
    addCleanup(() => removeEventListener('resize', onResize));
  };

  if (Q) play(Q.circleLevel); else levelSelect();
  return () => cleanupFns.forEach(f => f());
};
